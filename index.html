function pointInBbox(lon, lat, bbox) {
  if (!bbox) return true;
  const [minLon, minLat, maxLon, maxLat] = bbox;
  return lon >= minLon && lon <= maxLon && lat >= minLat && lat <= maxLat;
}

// レイキャスティング法による point-in-polygon 判定（ring: [[lon,lat],...] の閉じた輪）
function pointInPolygonRing(lon, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// フリーハンドで選択したポリゴンによる判定。まずbboxで粗く絞り込んでから
// 厳密なポリゴン判定を行うことで、大量データでの計算量を抑える。
function pointInSelection(lon, lat, state) {
  if (!state.bbox) return true;
  if (!pointInBbox(lon, lat, state.bbox)) return false;
  if (!state.polygon) return true;
  return pointInPolygonRing(lon, lat, state.polygon);
}

function estimateMcMaxCurvature(mags, binWidth = 0.1) {
  if (mags.length === 0) return null;
  const rounded = mags.map(m => Math.round(m / binWidth) * binWidth);
  const counts = new Map();
  rounded.forEach(m => counts.set(m, (counts.get(m) || 0) + 1));
  let bestM = null, bestCount = -1;
  for (const [m, c] of counts.entries()) {
    if (c > bestCount) { bestCount = c; bestM = m; }
  }
  return bestM;
}

// Goodness-of-Fit Test (Wiemer & Wyss, 2000) によるMc推定。
// 候補Mcを低い方から走査し、観測累積分布とGR則から予測される累積分布の
// 適合度R(%)が閾値(まず95%を狙い、ダメなら90%）を満たす最小Mcを採用する。
// どの候補も基準を満たさない場合は最大曲率法にフォールバックする。
function estimateMcGFT(mags, binWidth = 0.1) {
  if (mags.length === 0) return { mc: null, method: 'none' };

  const rounded = mags.map(m => Math.round(m / binWidth) * binWidth);
  const minM = Math.min(...rounded);
  const maxM = Math.max(...rounded);
  const nBins = Math.round((maxM - minM) / binWidth) + 1;
  const mcMaxCurv = estimateMcMaxCurvature(mags, binWidth);
  if (nBins < 3) {
    return { mc: mcMaxCurv, method: 'max-curvature' };
  }

  const tryThreshold = (targetR) => {
    // Wiemer & Wyss (2000) の標準的な運用に合わせ、最大曲率法のMcより
    // 低い候補は未検出域（ロールオフ）とみなして探索対象から除外する。
    // これにより低M側の小標本での偶然の高R%を誤採用するのを防ぐ。
    const searchStart = Math.max(minM, mcMaxCurv != null ? mcMaxCurv : minM);
    for (let m = searchStart; m <= maxM + 1e-9; m += binWidth) {
      const mcCand = Math.round(m / binWidth) * binWidth;
      const sample = mags.filter(x => x >= mcCand - 1e-9);
      const n = sample.length;
      if (n < 10) continue; // GFT自体、最低限のサンプルがないと無意味

      const meanM = sample.reduce((a, b) => a + b, 0) / n;
      const b = Math.LOG10E / (meanM - (mcCand - binWidth / 2));
      if (!isFinite(b) || b <= 0) continue;
      const a = Math.log10(n) + b * mcCand;

      // 観測累積度数 vs GR則予測累積度数 を mcCand以上のビンで比較
      let sumAbsDiff = 0, sumObs = 0;
      for (let mm = mcCand; mm <= maxM + 1e-9; mm += binWidth) {
        const mBin = Math.round(mm / binWidth) * binWidth;
        const obsCumulative = sample.filter(x => x >= mBin - 1e-9).length;
        const predCumulative = Math.pow(10, a - b * mBin);
        sumAbsDiff += Math.abs(obsCumulative - predCumulative);
        sumObs += obsCumulative;
      }
      if (sumObs === 0) continue;
      const R = 100 * (1 - sumAbsDiff / sumObs);
      if (R >= targetR) {
        return mcCand;
      }
    }
    return null;
  };

  let mc = tryThreshold(95);
  let method = 'gft-95';
  if (mc == null) {
    mc = tryThreshold(90);
    method = 'gft-90';
  }
  if (mc == null) {
    mc = mcMaxCurv;
    method = 'max-curvature';
  }
  return { mc, method };
}

function computeBvalueAki(mags, mc, binWidth = 0.1) {
  const sample = mags.filter(m => m >= mc - 1e-9);
  const n = sample.length;
  if (n < 2) return { b: null, n, stdErr: null };
  const meanM = sample.reduce((a, b) => a + b, 0) / n;
  const b = Math.LOG10E / (meanM - (mc - binWidth / 2));
  const variance = sample.reduce((acc, m) => acc + Math.pow(m - meanM, 2), 0) / (n * (n - 1));
  const stdErr = 2.30 * Math.sqrt(variance) * b * b;
  return { b, n, stdErr, meanM };
}

// n（Mc以上のサンプル数）とb値そのものの妥当性から信頼度ラベルを決める。
// 段階的に: n<10=信頼性低, n<20=参考値, n<30=やや少なめ, それ以上=十分。
// bが物理的にありえない範囲(0.3未満 or 3.0超)の場合は常に警告を強める。
function assessBvalueReliability(n, b) {
  const bAbnormal = (b < 0.3 || b > 3.0);

  let level, label;
  if (n < 10) {
    level = 'danger';
    label = `信頼性低（n=${n}件）`;
  } else if (n < 20) {
    level = 'warn';
    label = `参考値（n=${n}件・やや少数）`;
  } else if (n < 30) {
    level = 'caution';
    label = `n=${n}件（もう少しデータがあると安定）`;
  } else {
    level = 'ok';
    label = null;
  }

  if (bAbnormal) {
    level = 'danger';
    label = `b値が信頼できない数値です`;
  }

  return { level, label };
}

function updateBvSummaryChip(text, level = 'caution') {
  const dot = document.getElementById('bv-summary-dot');
  const textEl = document.getElementById('bv-summary-text');
  if (!dot || !textEl) return;
  dot.className = `bv-summary-dot ${level}`;
  textEl.textContent = text;
}

function computeAndRenderBvalue() {
  computeAndRenderBvalueInner();
}

function computeAndRenderBvalueInner() {
  const resultEl = document.getElementById('bv-result');
  if (!resultEl) return;

  if (!bvalueState.bbox) {
    resultEl.innerHTML = `<span style="color:var(--text-2);">地図上で解析対象領域を選択</span>`;
    updateBvSummaryChip('領域未選択', 'caution');
    return;
  }

  const filtered = bvalueState.data.filter(f => pointInSelection(f.lon, f.lat, bvalueState));
  const mags = filtered.map(f => f.mag).filter(m => m != null);

  if (mags.length < 5) {
    resultEl.innerHTML = `対象地震数: ${mags.length}<br><span style="color:var(--text-2);">解析には最低5件以上必要です</span>`;
    updateBvSummaryChip(`データ不足（n=${mags.length}）`, 'danger');
    return;
  }

  const mcMode = document.getElementById('bv-mc-mode').value;
  let mc;
  let mcMethodNote = '';
  if (mcMode === 'manual') {
    mc = parseFloat(document.getElementById('bv-mc-manual').value) || 2.0;
  } else if (mcMode === 'max-curvature') {
    mc = estimateMcMaxCurvature(mags);
  } else {
    const gft = estimateMcGFT(mags);
    mc = gft.mc;
    if (gft.method === 'max-curvature') {
      mcMethodNote = '<br><span style="color:var(--text-2); font-size:11px; word-break:keep-all; overflow-wrap:break-word;">曲率法にフォールバック</span>';
    } else if (gft.method === 'gft-90') {
      mcMethodNote = '<br><span style="color:var(--text-2); font-size:11px; word-break:keep-all; overflow-wrap:break-word;">GFT適合度90%基準を採用（95%未達）</span>';
    }
  }

  if (mc == null) {
    resultEl.innerHTML = `Mcの推定に失敗しました`;
    updateBvSummaryChip('Mc推定失敗', 'danger');
    return;
  }

  const { b, n, stdErr, meanM } = computeBvalueAki(mags, mc);

  if (b == null) {
    resultEl.innerHTML = `Mc以上のデータが不足しています（Mc=${mc.toFixed(1)}）`;
    updateBvSummaryChip('データ不足', 'danger');
    return;
  }

  const aValue = Math.log10(n) + b * mc;
  const reliability = assessBvalueReliability(n, b);

  const levelColor = {
    danger: 'var(--danger)',
    warn: 'var(--accent)',
    caution: 'var(--text-2)',
    ok: 'var(--text-2)'
  }[reliability.level];

  const warningHtml = reliability.label
    ? `<div style="margin-top:6px; padding:6px 8px; border-radius:6px; background:rgba(255,255,255,0.04); border:1px solid ${levelColor}; color:${levelColor}; font-size:11.5px; line-height:1.5;">${reliability.label}</div>`
    : '';

  updateBvSummaryChip(`b = ${b.toFixed(3)}`, reliability.level);

  resultEl.innerHTML = `
    <div class="font-num" style="font-size:26px; font-weight:800; color:var(--accent); font-family:var(--font-base);">
      b = ${b.toFixed(3)} <span style="font-size:13px; color:var(--text-2); font-weight:400;">± ${stdErr.toFixed(3)}</span>
    </div>
    ${warningHtml}
    <div class="divider" style="margin:8px 0;"></div>
    総地震数（選択領域）: ${mags.length}<br>
    Mc（完全性閾値）: ${mc.toFixed(1)}${mcMethodNote}<br>
    解析対象数（M≥Mc）: ${n}<br>
    平均M: ${meanM.toFixed(2)}<br>
    a値（推定）: ${aValue.toFixed(2)}
  `;
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function toRad(d) { return d * Math.PI / 180; }

// strike/dip/rake（断層面固有の値）に依存する三角関数値を1回だけ計算しておくための関数。
// renderBeachballDataUrl のピクセルループ内で strike/dip/rake を毎回ラジアン変換・
// sin/cos計算するのは無駄なので、事前計算した値を pPolarityFast に渡す。
function precomputeFaultTrig(strikeDeg, dipDeg, rakeDeg) {
  const strike = toRad(strikeDeg), dip = toRad(dipDeg), rake = toRad(rakeDeg);
  return {
    strike,
    sinDip: Math.sin(dip), cosDip: Math.cos(dip),
    sin2Dip: Math.sin(2 * dip), cos2Dip: Math.cos(2 * dip),
    sinRake: Math.sin(rake), cosRake: Math.cos(rake)
  };
}

// az/toff（ピクセルごとに変わる観測方向）だけをその都度ラジアン変換して判定する高速版。
function pPolarityFast(trig, azDeg, toffDeg) {
  const az = toRad(azDeg), toff = toRad(toffDeg);
  const phi = az - trig.strike;

  const sinToff = Math.sin(toff), cosToff = Math.cos(toff);
  const sinPhi = Math.sin(phi), cosPhi = Math.cos(phi);
  const sin2Phi = Math.sin(2 * phi);

  const Rp =
    trig.cosRake * trig.sinDip * sinToff * sinToff * sin2Phi
    - trig.cosRake * trig.cosDip * 2 * sinToff * cosToff * cosPhi
    + trig.sinRake * trig.sin2Dip * (cosToff * cosToff - sinToff * sinToff * sinPhi * sinPhi)
    + trig.sinRake * trig.cos2Dip * 2 * sinToff * cosToff * sinPhi;

  return Rp >= 0 ? 1 : -1;
}

// 互換用ラッパー（既存の呼び出し箇所・他コードから単発で呼ばれても動くように残す）
function pPolarity(strikeDeg, dipDeg, rakeDeg, azDeg, toffDeg) {
  return pPolarityFast(precomputeFaultTrig(strikeDeg, dipDeg, rakeDeg), azDeg, toffDeg);
}

function computePTAxes(strikeDeg, dipDeg, rakeDeg) {
  const strike = toRad(strikeDeg), dip = toRad(dipDeg), rake = toRad(rakeDeg);

  const n = [
    -Math.sin(dip) * Math.sin(strike),
    Math.sin(dip) * Math.cos(strike),
    -Math.cos(dip)
  ];
  const d = [
    Math.cos(rake) * Math.cos(strike) + Math.sin(rake) * Math.cos(dip) * Math.sin(strike),
    Math.cos(rake) * Math.sin(strike) - Math.sin(rake) * Math.cos(dip) * Math.cos(strike),
    -Math.sin(rake) * Math.sin(dip)
  ];

  const t = [(n[0] - d[0]) / Math.SQRT2, (n[1] - d[1]) / Math.SQRT2, (n[2] - d[2]) / Math.SQRT2];
  const p = [(n[0] + d[0]) / Math.SQRT2, (n[1] + d[1]) / Math.SQRT2, (n[2] + d[2]) / Math.SQRT2];

  function toAzToff(v) {
    let [north, east, down] = v;
    if (down < 0) { north = -north; east = -east; down = -down; }
    const toff = Math.acos(Math.max(-1, Math.min(1, down))) * 180 / Math.PI; 
    const az = Math.atan2(east, north) * 180 / Math.PI;
    return { az, toff };
  }

  return { P: toAzToff(p), T: toAzToff(t) };
}

function projectLowerHemisphere(azDeg, toffDeg, cx, cy, R) {
  const rNorm = Math.SQRT2 * Math.sin(toRad(toffDeg) / 2);
  const az = toRad(azDeg);
  const x = cx + R * rNorm * Math.sin(az);
  const y = cy - R * rNorm * Math.cos(az);
  return { x, y };
}

// --- ビーチボール（震源球）描画のWorker化 -------------------------------------
// 260x260px でも67,600ピクセル分の三角関数計算が発生し、メインスレッドで同期実行すると
// 一覧のイベントを連続でクリックした際にUIがカクつく（特にモバイル端末）。
// Web Workerでピクセル判定処理を行い、ImageBitmapをメインスレッドでcanvasに描画する。
let beachballWorker = null;
let beachballWorkerReqId = 0;
const beachballWorkerPending = new Map();

function getBeachballWorker() {
  if (beachballWorker) return beachballWorker;
  const workerSrc = `
    function toRad(d) { return d * Math.PI / 180; }
    function precomputeFaultTrig(strikeDeg, dipDeg, rakeDeg) {
      const strike = toRad(strikeDeg), dip = toRad(dipDeg), rake = toRad(rakeDeg);
      return {
        strike,
        sinDip: Math.sin(dip), cosDip: Math.cos(dip),
        sin2Dip: Math.sin(2 * dip), cos2Dip: Math.cos(2 * dip),
        sinRake: Math.sin(rake), cosRake: Math.cos(rake)
      };
    }
    function pPolarityFast(trig, azDeg, toffDeg) {
      const az = toRad(azDeg), toff = toRad(toffDeg);
      const phi = az - trig.strike;
      const sinToff = Math.sin(toff), cosToff = Math.cos(toff);
      const sinPhi = Math.sin(phi), cosPhi = Math.cos(phi);
      const sin2Phi = Math.sin(2 * phi);
      const Rp =
        trig.cosRake * trig.sinDip * sinToff * sinToff * sin2Phi
        - trig.cosRake * trig.cosDip * 2 * sinToff * cosToff * cosPhi
        + trig.sinRake * trig.sin2Dip * (cosToff * cosToff - sinToff * sinToff * sinPhi * sinPhi)
        + trig.sinRake * trig.cos2Dip * 2 * sinToff * cosToff * sinPhi;
      return Rp >= 0 ? 1 : -1;
    }
    self.onmessage = function(e) {
      const { reqId, strikeDeg, dipDeg, rakeDeg, size, cx, cy, R, compressColor } = e.data;
      const trig = precomputeFaultTrig(strikeDeg, dipDeg, rakeDeg);
      const mask = new Uint8ClampedArray(size * size); // 1 = 圧縮側（塗りつぶし）
      for (let py = 0; py < size; py++) {
        for (let px = 0; px < size; px++) {
          const x = (px - cx) / R;
          const y = -(py - cy) / R;
          const rNorm = Math.sqrt(x * x + y * y);
          if (rNorm > 1) continue;
          const toff = 2 * Math.asin(Math.min(1, rNorm / Math.SQRT2)) * 180 / Math.PI;
          const az = Math.atan2(x, y) * 180 / Math.PI;
          if (pPolarityFast(trig, az, toff) > 0) mask[py * size + px] = 1;
        }
      }
      self.postMessage({ reqId, mask }, [mask.buffer]);
    };
  `;
  const blob = new Blob([workerSrc], { type: 'application/javascript' });
  beachballWorker = new Worker(URL.createObjectURL(blob));
  beachballWorker.onmessage = (e) => {
    const { reqId, mask } = e.data;
    const resolver = beachballWorkerPending.get(reqId);
    if (resolver) {
      beachballWorkerPending.delete(reqId);
      resolver(mask);
    }
  };
  beachballWorker.onerror = (err) => {
    console.error('震源球描画Workerでエラー:', err);
    // 保留中の全リクエストを失敗させ、呼び出し側の同期フォールバックに任せる
    for (const resolver of beachballWorkerPending.values()) resolver(null);
    beachballWorkerPending.clear();
  };
  return beachballWorker;
}

function computeBeachballMaskAsync(strikeDeg, dipDeg, rakeDeg, size, cx, cy, R) {
  return new Promise((resolve) => {
    try {
      const worker = getBeachballWorker();
      const reqId = ++beachballWorkerReqId;
      beachballWorkerPending.set(reqId, resolve);
      worker.postMessage({ reqId, strikeDeg, dipDeg, rakeDeg, size, cx, cy, R });
    } catch (e) {
      // Worker生成自体に失敗した環境（file://実行時のBlob制限等）向けフォールバック
      console.error('震源球描画Workerの初期化に失敗しました。同期描画にフォールバックします:', e);
      resolve(null);
    }
  });
}

// Worker結果（圧縮側マスク）とコンパス/PT軸ラベルを合成してcanvasに描画する共通処理。
// synchronous版・async版の両方から呼ばれる。
function paintBeachballCanvas(ctx, mask, strikeDeg, dipDeg, rakeDeg, size, cx, cy, R, colorCompress, colorTension) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  ctx.fillStyle = `rgb(${colorTension.join(',')})`;
  ctx.fillRect(0, 0, size, size);

  if (mask) {
    const img = ctx.getImageData(0, 0, size, size);
    const data = img.data;
    for (let py = 0; py < size; py++) {
      for (let px = 0; px < size; px++) {
        if (!mask[py * size + px]) continue;
        const idx = (py * size + px) * 4;
        data[idx] = colorCompress[0]; data[idx + 1] = colorCompress[1]; data[idx + 2] = colorCompress[2]; data[idx + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  } else {
    // mask が無い（Worker不可）場合は同期計算にフォールバック
    const trig = precomputeFaultTrig(strikeDeg, dipDeg, rakeDeg);
    const img = ctx.getImageData(0, 0, size, size);
    const data = img.data;
    for (let py = 0; py < size; py++) {
      for (let px = 0; px < size; px++) {
        const x = (px - cx) / R;
        const y = -(py - cy) / R;
        const rNorm = Math.sqrt(x * x + y * y);
        if (rNorm > 1) continue;
        const toff = 2 * Math.asin(Math.min(1, rNorm / Math.SQRT2)) * 180 / Math.PI;
        const az = Math.atan2(x, y) * 180 / Math.PI;
        if (pPolarityFast(trig, az, toff) > 0) {
          const idx = (py * size + px) * 4;
          data[idx] = colorCompress[0]; data[idx + 1] = colorCompress[1]; data[idx + 2] = colorCompress[2]; data[idx + 3] = 255;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  ctx.restore();
}

// 非同期版：Workerでピクセル判定を行い、メインスレッドは合成・ラベル描画のみ行う。
// 呼び出し側は await して dataURL を受け取る。
async function renderBeachballDataUrlAsync(strikeDeg, dipDeg, rakeDeg, size = 200) {
  const COLOR_COMPRESS = [142, 142, 142];
  const COLOR_TENSION  = [255, 255, 255];
  const COLOR_BORDER   = '#b4b4b4';
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const cx = size / 2, cy = size / 2;
  const labelMargin = size * 0.09;
  const R = size / 2 - 2 - labelMargin;

  const mask = await computeBeachballMaskAsync(strikeDeg, dipDeg, rakeDeg, size, cx, cy, R);
  paintBeachballCanvas(ctx, mask, strikeDeg, dipDeg, rakeDeg, size, cx, cy, R, COLOR_COMPRESS, COLOR_TENSION);

  drawBeachballFrameAndLabels(ctx, strikeDeg, dipDeg, rakeDeg, size, cx, cy, R, labelMargin, COLOR_BORDER);
  return canvas.toDataURL('image/png');
}

function drawBeachballFrameAndLabels(ctx, strikeDeg, dipDeg, rakeDeg, size, cx, cy, R, labelMargin, colorBorder) {
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = colorBorder;
  ctx.lineWidth = 1.8;
  ctx.stroke();

  const compassFontSize = Math.round(size * 0.075);
  ctx.font = `${compassFontSize}px ${getComputedStyle(document.body).fontFamily || 'sans-serif'}`;
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const compassR = R + labelMargin * 0.62;
  ctx.fillText('N', cx, cy - compassR);
  ctx.fillText('S', cx, cy + compassR);
  ctx.fillText('E', cx + compassR, cy);
  ctx.fillText('W', cx - compassR, cy);
}

// 同期版（フォールバック・互換用に残置。Workerが使えない環境や即時描画が必要な場合に利用）
// ピクセルループ自体は precomputeFaultTrig + pPolarityFast により高速化済み。
function renderBeachballDataUrl(strikeDeg, dipDeg, rakeDeg, size = 200) {
  const COLOR_COMPRESS = [142, 142, 142];
  const COLOR_TENSION  = [255, 255, 255];
  const COLOR_BORDER   = '#b4b4b4';
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const cx = size / 2, cy = size / 2;
  const labelMargin = size * 0.09;
  const R = size / 2 - 2 - labelMargin;

  ctx.clearRect(0, 0, size, size);
  paintBeachballCanvas(ctx, null, strikeDeg, dipDeg, rakeDeg, size, cx, cy, R, COLOR_COMPRESS, COLOR_TENSION);
  drawBeachballFrameAndLabels(ctx, strikeDeg, dipDeg, rakeDeg, size, cx, cy, R, labelMargin, COLOR_BORDER);

  return canvas.toDataURL('image/png');
}

// JMAの発震機構解ページはCORS未対応（同一オリジンからの直接fetchが不可能）なため、
// 第三者プロキシ経由での取得が必須になる。以前は r.jina.ai 単体に依存しており、
// このサービスが停止・レート制限された瞬間に震源球タブ全体が使えなくなっていた。
// ここでは複数の候補プロキシを順に試し、最初に成功したものを使うようにする。
// （それでも「外部の無料プロキシに依存する」という根本的な脆さは残るため、
//  全滅時にはJMA公式ページへの直接リンクを必ず提示する。）
const MECH_PROXY_CANDIDATES = [
  {
    name: 'r.jina.ai',
    build: (targetUrl) => `https://r.jina.ai/${targetUrl}`
  },
  {
    name: 'allorigins',
    build: (targetUrl) => `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
  },
  {
    name: 'corsproxy.io',
    build: (targetUrl) => `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`
  }
];

// 直近に成功したプロキシを覚えておき、次回はそれを先頭から試すことで
// 無駄な失敗リクエストを減らす（成功実績のあるプロキシを優先）。
let lastWorkingMechProxyName = null;

function orderedMechProxyCandidates() {
  if (!lastWorkingMechProxyName) return MECH_PROXY_CANDIDATES;
  const idx = MECH_PROXY_CANDIDATES.findIndex(p => p.name === lastWorkingMechProxyName);
  if (idx <= 0) return MECH_PROXY_CANDIDATES;
  return [MECH_PROXY_CANDIDATES[idx], ...MECH_PROXY_CANDIDATES.filter((_, i) => i !== idx)];
}

// 複数プロキシを順に試し、最初に成功したレスポンスのテキストを返す。
// 全滅した場合は、どのプロキシが何のエラーで失敗したかをまとめた Error を投げる。
async function fetchViaMechProxies(targetUrl) {
  const candidates = orderedMechProxyCandidates();
  const attempts = [];
  for (const proxy of candidates) {
    try {
      const res = await fetch(proxy.build(targetUrl));
      if (!res.ok) {
        attempts.push(`${proxy.name}: HTTP ${res.status}`);
        continue;
      }
      const text = await res.text();
      if (!text || text.trim().length === 0) {
        attempts.push(`${proxy.name}: 空レスポンス`);
        continue;
      }
      lastWorkingMechProxyName = proxy.name;
      return text;
    } catch (e) {
      // fetch自体の失敗（プロキシ側のCORS・ネットワークエラー等）
      attempts.push(`${proxy.name}: ${e.message || 'ネットワークエラー'}`);
    }
  }
  const err = new Error(`全プロキシで取得に失敗しました（${attempts.join(' / ')}）`);
  err.mechProxyAttempts = attempts;
  throw err;
}

async function fetchMechList() {
  const target = 'https://www.data.jma.go.jp/eew/data/mech/top.html';
  const text = await fetchViaMechProxies(target);
  return parseMechListText(text);
}

function splitMdRow(line) {
  let s = line.trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|')) s = s.slice(0, -1);
  return s.split('|').map(c => c.trim());
}

function parseMdLink(cell) {
  const m = /\[([^\]]*)\]\(([^\s)]+)(?:\s+"[^"]*")?\)/.exec(cell);
  if (!m) return null;
  return { label: m[1], url: m[2] };
}

function parseJmaTimeStrToMs(timeStr) {
  const m = /(\d{4})年(\d{2})月(\d{2})日(\d{2})時(\d{2})分/.exec(timeStr || '');
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]), h = Number(m[4]), mi = Number(m[5]);
  return Date.UTC(y, mo - 1, d, h, mi) - 9 * 60 * 60 * 1000;
}

function parseMechListText(text) {
  const lines = text.split('\n');
  const rows = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line.includes('|') || !/\d{4}年\d{2}月\d{2}日\d{2}時\d{2}分頃/.test(line)) continue;

    const cells = splitMdRow(line);
    if (cells.length < 6) continue;

    const timeMatch = /(\d{4}年\d{2}月\d{2}日\d{2}時\d{2}分頃)/.exec(cells[0]);
    if (!timeMatch) continue;
    const timeStr = timeMatch[1];

    let lat = null, lon = null, depth = null, mag = null, place = null;
    const links = [];
    for (const c of cells.slice(1)) {
      const latM = /北緯([\d.]+)度/.exec(c);
      const lonM = /東経([\d.]+)度/.exec(c);
      const depM = depth == null && /^(約?[\d.]+\s*km|ごく浅い)$/.exec(c);
      if (latM) { lat = parseFloat(latM[1]); continue; }
      if (lonM) { lon = parseFloat(lonM[1]); continue; }
      if (depM) { depth = c; continue; }
      const link = parseMdLink(c);
      if (link) { links.push(link); continue; }
      if (c === '-') { links.push(null); continue; }
      if (/^[\d.]+$/.test(c) && mag == null) { mag = parseFloat(c); continue; }
      if (c && place == null && !/^[\d.]+$/.test(c)) { place = c; continue; }
    }

    if (lat == null || lon == null || mag == null) continue;

    const solutions = [];
    if (links[0]) solutions.push({ source: 'jma', kind: 'initial', label: '初動解', url: links[0].url });
    if (links[1]) solutions.push({ source: 'jma', kind: 'cmt-domestic', label: 'CMT解(国内)', url: links[1].url });
    if (links[2]) solutions.push({ source: 'jma', kind: 'cmt-world', label: 'CMT解(全世界)', url: links[2].url });

    rows.push({
      source: 'jma',
      timeStr,
      timeMs: parseJmaTimeStrToMs(timeStr),
      lat, lon,
      depth: depth || '不明',
      mag,
      place: place || '不明',
      initial: links[0] || null,
      cmtDomestic: links[1] || null,
      cmtWorld: links[2] || null,
      solutions
    });
  }
  return rows;
}

function mechFigImageUrl(figHtmlUrl) {
  return figHtmlUrl.replace(/\.html$/, '.png');
}

function fitMechImage(img) {
  const src = img.currentSrc || img.src || '';
  if (src.startsWith('data:')) {
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.maxWidth = '100%';
    img.style.maxHeight = '100%';
    img.style.objectFit = 'contain';
    img.style.transform = 'none';
    return;
  }
  const fname = src.split('/').pop() || '';
  let scale = 1.3;
  if (/^mc/.test(fname)) scale = 1.55;         
  else if (/^cmt/.test(fname)) scale = 1.15;   
  else if (/^world/.test(fname)) scale = 1.3;  

  img.style.width = '100%';
  img.style.height = '100%';
  img.style.maxWidth = '100%';
  img.style.maxHeight = '100%';
  img.style.objectFit = 'contain';
  img.style.transform = `scale(${scale})`;
}

function mechImageFallback(img) {
  const parent = img.parentElement;
  if (parent) {
    parent.innerHTML = '<span style="color:var(--text-2); font-size:11px; padding:10px; text-align:center;">画像取得不可</span>';
  }
}

async function fetchMechDetail(url) {
  const text = await fetchViaMechProxies(url);
  return parseMechDetailText(text, url);
}

function parseMechDetailText(text, sourceUrl) {
  const lines = text.split('\n');
  const detail = {
    imageUrl: null,
    planes: null,        
    axes: null,           
    stations: null,
    vr: null,
    centroid: null,       
    moment: null          
  };

  let axesAzimuth = null; 
  let axesPlunge = null;  

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    const imgM = /!\[[^\]]*\]\((https?:\/\/[^\s)]+\.png)\)/.exec(line);
    if (imgM && !detail.imageUrl) detail.imageUrl = imgM[1];

    if (!line.includes('|')) continue;
    const cells = splitMdRow(line);

    if (!detail.centroid) {
      const timeM = /^(\d{4}年\d{2}月\d{2}日\d{2}時\d{2}分[\d.]+秒)$/.exec((cells[0] || '').trim());
      const latM = /北緯([\d.]+)度([\d.]+)分/.exec(cells[1] || '');
      const lonM = /東経([\d.]+)度([\d.]+)分/.exec(cells[2] || '');
      if (timeM && latM && lonM) {
        detail.centroid = {
          timeStr: timeM[1],
          lat: (parseFloat(latM[1]) + parseFloat(latM[2]) / 60).toFixed(3),
          lon: (parseFloat(lonM[1]) + parseFloat(lonM[2]) / 60).toFixed(3),
          depth: (cells[3] || '').trim(),
          mw: (cells[4] || '').trim()
        };
        continue;
      }
    }

    if (!detail.moment) {
      const prevCells = i > 0 && lines[i - 1].includes('|') ? splitMdRow(lines[i - 1]) : null;
      const isMomentHeader = prevCells && prevCells[0] === 'Mo' && prevCells[1] === 'Mrr';
      if (isMomentHeader && cells.length >= 10 && /^-?[\d.]+$/.test(cells[0])) {
        detail.moment = {
          mo: cells[0], mrr: cells[1], mtt: cells[2], mff: cells[3],
          mrt: cells[4], mrf: cells[5], mtf: cells[6],
          exponent: cells[7], unit: cells[8], nonDc: cells[9]
        };
        continue;
      }
    }

    if (cells[0] && cells[0].includes('断層面解')) {
      if (!detail.planes) detail.planes = [];
      detail.planes.push({
        label: cells[0],
        strike: cells[1], dip: cells[2], rake: cells[3]
      });
      if (cells.length >= 8) {
        if (cells[4] === '方位') {
          axesAzimuth = { p: cells[5], t: cells[6], n: cells[7] };
        } else if (cells[4] === '傾斜') {
          axesPlunge = { p: cells[5], t: cells[6], n: cells[7] };
        }
      }
    }

    if (cells.some(c => c.includes('観測点数'))) {
      const idx = cells.findIndex(c => c.includes('観測点数'));
      if (idx >= 0 && cells[idx + 1]) detail.stations = cells[idx + 1];
      const scoreIdx = cells.findIndex(c => c.includes('V.R.') || c === 'スコア');
      if (scoreIdx >= 0 && cells[scoreIdx + 1]) {
        detail.vr = cells[scoreIdx + 1];
        detail.vrLabel = cells[scoreIdx]; 
      }
    }
  }

  if (axesAzimuth || axesPlunge) {
    detail.axes = {
      p: { azimuth: axesAzimuth ? axesAzimuth.p : null, plunge: axesPlunge ? axesPlunge.p : null },
      t: { azimuth: axesAzimuth ? axesAzimuth.t : null, plunge: axesPlunge ? axesPlunge.t : null },
      n: { azimuth: axesAzimuth ? axesAzimuth.n : null, plunge: axesPlunge ? axesPlunge.n : null }
    };
  }

  if (!detail.imageUrl) {
    detail.imageUrl = mechFigImageUrl(sourceUrl);
  }
  return detail;
}

const USGS_FDSN_BASE = 'https://earthquake.usgs.gov/fdsnws/event/1/query';
const USGS_MIN_MAGNITUDE = 5.0;
const USGS_LOOKBACK_DAYS = 5;

function usgsQueryUrl(producttype) {
  const end = new Date();
  const start = new Date(end.getTime() - USGS_LOOKBACK_DAYS * 24 * 60 * 60 * 1000);
  const params = new URLSearchParams({
    format: 'geojson',
    starttime: start.toISOString(),
    endtime: end.toISOString(),
    minmagnitude: String(USGS_MIN_MAGNITUDE),
    producttype,
    orderby: 'time'
  });
  return `${USGS_FDSN_BASE}?${params.toString()}`;
}

async function fetchUsgsList() {
  const [fmRes, mtRes, imtRes] = await Promise.all([
    fetch(usgsQueryUrl('focal-mechanism')),
    fetch(usgsQueryUrl('moment-tensor')),
    fetch(usgsQueryUrl('internal-moment-tensor'))
  ]);
  const [fmData, mtData, imtData] = await Promise.all([
    fmRes.ok ? fmRes.json() : { features: [] },
    mtRes.ok ? mtRes.json() : { features: [] },
    imtRes.ok ? imtRes.json() : { features: [] }
  ]);

  const byId = new Map();
  for (const feat of fmData.features) {
    byId.set(feat.id, { feat, hasFocalMechanism: true, hasMomentTensor: false });
  }
  for (const feat of [...mtData.features, ...imtData.features]) {
    const existing = byId.get(feat.id);
    if (existing) existing.hasMomentTensor = true;
    else byId.set(feat.id, { feat, hasFocalMechanism: false, hasMomentTensor: true });
  }

  const rows = [];
  for (const { feat, hasFocalMechanism, hasMomentTensor } of byId.values()) {
    const p = feat.properties || {};
    const [lon, lat] = feat.geometry ? feat.geometry.coordinates : [null, null];
    if (lat == null || lon == null || p.mag == null) continue;

    const solutions = [];
    if (hasFocalMechanism) {
      solutions.push({ source: 'usgs', kind: 'focal-mechanism', label: 'USGS初動解', eventId: feat.id });
    }
    if (hasMomentTensor) {
      solutions.push({ source: 'usgs', kind: 'moment-tensor', label: 'USGS CMT', eventId: feat.id });
    }
    if (!solutions.length) continue;

    rows.push({
      source: 'usgs',
      eventId: feat.id,
      timeStr: formatUsgsTime(p.time),
      timeMs: p.time,
      lat, lon,
      depth: feat.geometry && feat.geometry.coordinates[2] != null ? `${feat.geometry.coordinates[2].toFixed(0)}km` : '不明',
      mag: p.mag,
      place: p.place || '不明',
      solutions
    });
  }
  return rows;
}

function formatUsgsTime(timeMs) {
  if (timeMs == null) return '不明';
  const d = new Date(timeMs);
  const jst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
  const y = jst.getUTCFullYear();
  const mo = String(jst.getUTCMonth() + 1).padStart(2, '0');
  const day = String(jst.getUTCDate()).padStart(2, '0');
  const h = String(jst.getUTCHours()).padStart(2, '0');
  const mi = String(jst.getUTCMinutes()).padStart(2, '0');
  return `${y}年${mo}月${day}日${h}時${mi}分頃`;
}

async function buildUsgsDetail(feat, kind) {
  const products = (feat.properties && feat.properties.products) || {};
  let prod = (products[kind] && products[kind][0]) || null;
  if (!prod && kind === 'moment-tensor') {
    prod = (products['internal-moment-tensor'] && products['internal-moment-tensor'][0]) || null;
  }
  const pr = (prod && prod.properties) || {};

  const detail = {
    imageUrl: null,
    planes: null,
    axes: null,
    stations: pr['num-stations-used'] || null,
    vr: null,
    vrLabel: 'DC比',
    centroid: null,
    moment: null,
    sourceLabel: 'USGS',
    externalUrl: (feat.properties && feat.properties.url) || null
  };

  const np1 = { label: '断層面解１', strike: pr['nodal-plane-1-strike'], dip: pr['nodal-plane-1-dip'], rake: pr['nodal-plane-1-rake'] };
  const np2 = { label: '断層面解２', strike: pr['nodal-plane-2-strike'], dip: pr['nodal-plane-2-dip'], rake: pr['nodal-plane-2-rake'] };
  if (np1.strike != null || np2.strike != null) {
    detail.planes = [np1, np2];
    try {
      // Worker経由で描画（メインスレッドをブロックしない）。Worker不可時は内部でフォールバック。
      detail.imageUrl = await renderBeachballDataUrlAsync(
        parseFloat(np1.strike), parseFloat(np1.dip), parseFloat(np1.rake), 260
      );
    } catch (e) {
      console.error('震源球画像の生成に失敗しました:', e);
      detail.imageUrl = null;
    }
  }

  if (pr['percent-double-couple'] != null) {
    const dcPct = Math.round(parseFloat(pr['percent-double-couple']) * 100);
    detail.vr = `${dcPct}%`;
  }

  if (pr['t-axis-azimuth'] != null || pr['p-axis-azimuth'] != null) {
    detail.axes = {
      p: { azimuth: pr['p-axis-azimuth'], plunge: pr['p-axis-plunge'] },
      t: { azimuth: pr['t-axis-azimuth'], plunge: pr['t-axis-plunge'] },
      n: { azimuth: pr['n-axis-azimuth'], plunge: pr['n-axis-plunge'] }
    };
  }

  if (pr['derived-magnitude'] || pr['scalar-moment']) {
    const moRaw = parseFloat(pr['scalar-moment']);
    let mantissa = moRaw, exponent = 0;
    if (isFinite(moRaw) && moRaw > 0) {
      exponent = Math.floor(Math.log10(moRaw));
      mantissa = (moRaw / Math.pow(10, exponent)).toFixed(2);
    }
    detail.moment = {
      mo: isFinite(mantissa) ? String(mantissa) : (pr['scalar-moment'] || '—'),
      exponent: String(exponent),
      unit: 'Nm',
      mrr: pr['tensor-mrr'] ?? '—', mtt: pr['tensor-mtt'] ?? '—', mff: pr['tensor-mpp'] ?? '—',
      mrt: pr['tensor-mrt'] ?? '—', mrf: pr['tensor-mrp'] ?? '—', mtf: pr['tensor-mtp'] ?? '—',
      nonDc: pr['percent-double-couple'] ? `${(100 - Math.round(parseFloat(pr['percent-double-couple']) * 100))}%` : '—'
    };
  }

  if (pr['derived-latitude'] != null && pr['derived-longitude'] != null) {
    detail.centroid = {
      timeStr: pr['derived-eventtime'] ? formatUsgsTime(Date.parse(pr['derived-eventtime'])) : (feat.properties.time ? formatUsgsTime(feat.properties.time) : '不明'),
      lat: Number(pr['derived-latitude']).toFixed(3),
      lon: Number(pr['derived-longitude']).toFixed(3),
      depth: pr['derived-depth'] ? `${Math.round(parseFloat(pr['derived-depth']))}km` : '不明',
      mw: pr['derived-magnitude'] || (feat.properties.mag != null ? feat.properties.mag.toFixed(1) : '—')
    };
  }

  return detail;
}

async function fetchUsgsDetail(eventId, kind) {
  const url = `${USGS_FDSN_BASE}?eventid=${encodeURIComponent(eventId)}&format=geojson`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const feat = await res.json();
  return buildUsgsDetail(feat, kind);
}

const MECH_MERGE_TIME_TOLERANCE_MS = 120 * 1000;
const MECH_MERGE_DISTANCE_KM = 300;

function mergeMechRows(jmaRows, usgsRows) {
  const usedUsgsIdx = new Set();
  const merged = jmaRows.map(jr => {
    if (jr.timeMs == null) return jr;
    let bestIdx = -1, bestDist = Infinity;
    usgsRows.forEach((ur, i) => {
      if (usedUsgsIdx.has(i)) return;
      if (ur.timeMs == null) return;
      const dt = Math.abs(ur.timeMs - jr.timeMs);
      if (dt > MECH_MERGE_TIME_TOLERANCE_MS) return;
      const dist = haversineKm(jr.lat, jr.lon, ur.lat, ur.lon);
      if (dist > MECH_MERGE_DISTANCE_KM) return;
      if (dist < bestDist) { bestDist = dist; bestIdx = i; }
    });
    if (bestIdx === -1) return jr;

    usedUsgsIdx.add(bestIdx);
    const ur = usgsRows[bestIdx];
    return {
      ...jr,
      mergedFrom: ['jma', 'usgs'],
      solutions: [...jr.solutions, ...ur.solutions]
    };
  });

  usgsRows.forEach((ur, i) => {
    if (!usedUsgsIdx.has(i)) merged.push(ur);
  });

  merged.sort((a, b) => (b.timeMs ?? 0) - (a.timeMs ?? 0));
  return merged;
}

const mechState = {
  rows: [],
  selectedIdx: null,
  detailCache: new Map() 
};

function renderMechList() {
  const listEl = document.getElementById('mech-list');
  if (!listEl) return;
  listEl.innerHTML = mechState.rows.map((r, i) => {
    const badge = r.mergedFrom ? 'JMA+USGS' : (r.source === 'usgs' ? 'USGS' : 'JMA');
    const badgeColor = r.mergedFrom ? 'var(--accent-2)' : (r.source === 'usgs' ? 'var(--accent-mag)' : 'var(--text-2)');
    return `
      <div class="mech-item${mechState.selectedIdx === i ? ' selected' : ''}" data-idx="${i}" style="
        padding:12px 10px; margin-top:10px; border-radius:12px;
        background:rgba(255,255,255,0.04); border:1px solid var(--glass-border);
      ">
        <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">
          <div style="font-weight:700; font-size:13.5px;">${r.place}</div>
          <div style="display:flex; align-items:baseline; gap:8px; flex-shrink:0;">
            <span style="font-size:9.5px; color:${badgeColor}; border:1px solid ${badgeColor}; border-radius:6px; padding:1px 5px;">${badge}</span>
            <div class="font-num" style="font-family:var(--font-base); font-size:13px; color:var(--accent);">M${r.mag.toFixed(1)}</div>
          </div>
        </div>
        <div class="font-num" style="font-size:11.5px; color:var(--text-2); margin-top:2px; font-family:var(--font-base);">
          ${r.timeStr} / 北緯${r.lat}° 東経${r.lon}° / 深さ${r.depth}
        </div>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.mech-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx = Number(el.dataset.idx);
      selectMechItem(idx);
    });
  });
}

function selectMechItem(idx) {
  mechState.selectedIdx = idx;
  renderMechList();
  renderMechDetailPanel(idx);
}

function renderMechDetailPanel(idx) {
  const detailCol = document.getElementById('mech-detail-col');
  if (!detailCol) return;
  const r = mechState.rows[idx];
  if (!r) return;

  const solutions = r.solutions || [];

  detailCol.innerHTML = `
    <div class="glass-panel" style="padding:18px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;">
        <div style="font-weight:700; font-size:15px;">${r.place}</div>
        <div class="font-num" style="font-family:var(--font-base); font-size:14px; color:var(--accent);">M${r.mag.toFixed(1)}</div>
      </div>
      <div class="font-num" style="font-size:11.5px; color:var(--text-2); margin-top:3px; font-family:var(--font-base);">
        ${r.timeStr} / 北緯${r.lat}° 東経${r.lon}° / 深さ${r.depth}
        ${r.mergedFrom ? `<span style="color:var(--accent-2); margin-left:6px;">（JMA・USGS統合）</span>` : ''}
      </div>
      <div class="divider"></div>
      ${solutions.length ? `
        <div style="display:flex; gap:6px; flex-wrap:wrap;" id="mech-tab-row"></div>
        <div id="mech-detail-body" style="margin-top:12px;"></div>
      ` : `<div class="mech-detail-placeholder">この地震の発震機構解はまだ公開されていません</div>`}
    </div>
  `;

  if (!solutions.length) return;

  const tabRow = document.getElementById('mech-tab-row');
  tabRow.innerHTML = solutions.map((s, i) =>
    `<span class="mech-tab btn btn-sm${i === 0 ? ' btn-accent' : ''}" data-idx="${i}">${s.label}</span>`
  ).join('');

  tabRow.querySelectorAll('.mech-tab').forEach(el => {
    el.addEventListener('click', () => {
      tabRow.querySelectorAll('.mech-tab').forEach(t => t.classList.remove('btn-accent'));
      el.classList.add('btn-accent');
      const solIdx = Number(el.dataset.idx);
      loadMechDetailBody(solutions[solIdx]);
    });
  });

  loadMechDetailBody(solutions[0]);
}

async function loadMechDetailBody(solution) {
  const bodyEl = document.getElementById('mech-detail-body');
  if (!bodyEl) return;
  const cacheKey = solution.source === 'jma' ? solution.url : `usgs:${solution.eventId}:${solution.kind}`;
  bodyEl.innerHTML = `<div class="status-text"><span class="spinner"></span> ${solution.label}を読み込み中...</div>`;
  try {
    let detail = mechState.detailCache.get(cacheKey);
    if (!detail) {
      if (solution.source === 'jma') {
        detail = await fetchMechDetail(solution.url);
      } else {
        detail = await fetchUsgsDetail(solution.eventId, solution.kind);
      }
      mechState.detailCache.set(cacheKey, detail);
    }
    renderMechDetailBody(bodyEl, detail, solution);
  } catch (e) {
    console.error(e);
    const fallbackUrl = solution.source === 'jma' ? solution.url : `https://earthquake.usgs.gov/earthquakes/eventpage/${solution.eventId}/moment-tensor`;
    const fallbackLabel = solution.source === 'jma' ? '気象庁ページで直接見る' : 'USGSページで直接見る';
    bodyEl.innerHTML = `
      <span style="color:var(--danger); font-size:12px;">詳細の取得に失敗しました: ${e.message}</span>
      <div style="margin-top:8px; text-align:center;">
        <a href="${fallbackUrl}" target="_blank" rel="noopener" class="btn btn-sm" style="text-decoration:none;">${fallbackLabel} ↗</a>
      </div>
    `;
  }
}

function renderMechDetailBody(bodyEl, detail, solution) {
  const plane = (detail.planes && detail.planes[0]) || null;
  const plane2 = (detail.planes && detail.planes[1]) || null;
  const axes = detail.axes;
  const moment = detail.moment;
  const centroid = detail.centroid;
  const linkUrl = solution.source === 'jma' ? solution.url : (detail.externalUrl || `https://earthquake.usgs.gov/earthquakes/eventpage/${solution.eventId}`);
  const linkLabel = solution.source === 'jma' ? '気象庁ページで詳細を見る' : 'USGSページで詳細を見る';

  bodyEl.innerHTML = `
    <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start;">
      <div style="
        flex:0 0 auto;
        background:#000; border-radius:10px; overflow:hidden;
        display:flex; justify-content:center; align-items:center;
        width:180px; height:180px;
        border:1px solid var(--glass-border);
      ">
        ${detail.imageUrl ? `
        <img src="${detail.imageUrl}" alt="震源球" style="
          max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;
          mix-blend-mode:screen; filter:brightness(1.05);
        " onload="fitMechImage(this)" onerror="mechImageFallback(this)">
        ` : `<span style="color:var(--text-2); font-size:11px; padding:10px; text-align:center;">震源球を描画できませんでした</span>`}
      </div>
      <div style="flex:1 1 240px; min-width:200px;">
        ${centroid ? `
        <div style="font-size:10.5px; color:var(--text-2); letter-spacing:0.06em; margin-bottom:4px;">セントロイド（Mw）</div>
        <div class="font-num" style="font-family:var(--font-base); font-size:11.5px; color:var(--text-1); line-height:1.7;">
          ${centroid.timeStr}<br>
          北緯${centroid.lat}° 東経${centroid.lon}° / 深さ${centroid.depth}<br>
          <span style="color:var(--accent); font-weight:700; font-size:13px;">Mw ${centroid.mw}</span>
        </div>
        <div class="divider" style="margin:8px 0;"></div>
        ` : ''}
        ${plane ? `
        <div style="font-size:10.5px; color:var(--text-2); letter-spacing:0.06em; margin-bottom:4px;">断層パラメータ（走向 / 傾斜 / すべり角）</div>
        <div class="font-num" style="font-family:var(--font-base); font-size:11.5px; color:var(--text-1); line-height:1.8;">
          断層面解１： ${plane.strike}° / ${plane.dip}° / ${plane.rake}°<br>
          ${plane2 ? `断層面解２： ${plane2.strike}° / ${plane2.dip}° / ${plane2.rake}°<br>` : ''}
          ${detail.stations ? `観測点数： ${detail.stations}` : ''}${detail.vr ? ` ／ ${detail.vrLabel || 'V.R.'}： ${detail.vr}` : ''}
        </div>` : `<div style="font-size:11.5px; color:var(--text-2);">断層パラメータを解析できませんでした</div>`}
      </div>
    </div>

    ${axes ? `
    <div class="divider"></div>
    <div style="font-size:10.5px; color:var(--text-2); letter-spacing:0.06em; margin-bottom:6px;">主応力軸（方位 / 傾斜）</div>
    <div class="font-num" style="font-family:var(--font-base); font-size:11.5px; color:var(--text-1); line-height:1.9; display:grid; grid-template-columns:auto 1fr; column-gap:14px; max-width:280px;">
      <span style="color:var(--accent-2);">Ｐ軸（圧力軸）</span><span>${axes.p.azimuth ?? '—'}° / ${axes.p.plunge ?? '—'}°</span>
      <span style="color:var(--accent-mag);">Ｔ軸（張力軸）</span><span>${axes.t.azimuth ?? '—'}° / ${axes.t.plunge ?? '—'}°</span>
      <span style="color:var(--text-1);">Ｎ軸（中立軸）</span><span>${axes.n.azimuth ?? '—'}° / ${axes.n.plunge ?? '—'}°</span>
    </div>` : ''}

    ${moment ? `
    <div class="divider"></div>
    <div style="font-size:10.5px; color:var(--text-2); letter-spacing:0.06em; margin-bottom:6px;">モーメントテンソル解</div>
    <div class="font-num" style="font-family:var(--font-base); font-size:11.5px; color:var(--text-1); line-height:1.7;">
      Mo： ${moment.mo} × 10<sup>${moment.exponent}</sup> ${moment.unit.replace(/^×10\(指数\)\s*/, '')} ／ 非D.C.成分比： ${moment.nonDc}
    </div>
    <div class="font-num" style="font-family:var(--font-base); font-size:10.5px; color:var(--text-2); line-height:1.8; margin-top:6px; display:grid; grid-template-columns:repeat(3, auto); gap:2px 16px;">
      <span>Mrr = ${moment.mrr}</span><span>Mtt = ${moment.mtt}</span><span>Mff = ${moment.mff}</span>
      <span>Mrt = ${moment.mrt}</span><span>Mrf = ${moment.mrf}</span><span>Mtf = ${moment.mtf}</span>
    </div>` : ''}

    <div style="margin-top:12px; text-align:center;">
      <a href="${linkUrl}" target="_blank" rel="noopener" class="btn btn-sm" style="text-decoration:none;">${linkLabel} ↗</a>
    </div>
  `;
}

async function initMechView() {
  const scroll = document.getElementById('mech-scroll');
  scroll.innerHTML = `
    <div class="mech-layout">
      <div class="mech-list-col">
        <div class="glass-panel" style="padding:18px;">
          <div class="panel-title">震源球 — 主な地震の発震機構解（速報値・JMA直近5日間 / USGS世界全体 M${USGS_MIN_MAGNITUDE}+）</div>
          <div class="status-text" id="mech-status"><span class="spinner"></span> データを取得中...</div>
          <div id="mech-list"></div>
        </div>
      </div>
      <div class="mech-detail-col" id="mech-detail-col">
        <div class="glass-panel" style="min-height:100%;">
          <div class="mech-detail-placeholder">リストからイベントを選択してください</div>
        </div>
      </div>
    </div>
  `;

  const statusEl = document.getElementById('mech-status');

  const [jmaResult, usgsResult] = await Promise.allSettled([
    fetchMechList(),
    fetchUsgsList()
  ]);

  const jmaRows = jmaResult.status === 'fulfilled' ? jmaResult.value : [];
  const usgsRows = usgsResult.status === 'fulfilled' ? usgsResult.value : [];

  // JMA取得失敗時は「全プロキシがどう失敗したか」までコンソールに残す。
  // r.jina.ai / allorigins / corsproxy.io のいずれかが仕様変更・レート制限で
  // 落ちても、原因調査にすぐ辿り着けるようにするため。
  if (jmaResult.status === 'rejected') {
    console.error('JMA一覧取得失敗:', jmaResult.reason);
    if (jmaResult.reason && jmaResult.reason.mechProxyAttempts) {
      console.error('プロキシ試行内訳:', jmaResult.reason.mechProxyAttempts);
    }
  }
  if (usgsResult.status === 'rejected') console.error('USGS一覧取得失敗:', usgsResult.reason);

  const rows = mergeMechRows(jmaRows, usgsRows);

  if (rows.length === 0) {
    const jmaDetail = (jmaResult.status === 'rejected' && jmaResult.reason && jmaResult.reason.mechProxyAttempts)
      ? `<div style="font-size:10.5px; color:var(--text-2); margin-top:4px;">JMA取得の内訳： ${jmaResult.reason.mechProxyAttempts.join(' / ')}</div>`
      : '';
    statusEl.innerHTML = `<span style="color:var(--danger);">データを取得できませんでした（JMA/USGSとも失敗、またはページ構造が変更された可能性があります）</span>
      ${jmaDetail}
      <div style="margin-top:8px;"><a href="https://www.data.jma.go.jp/eew/data/mech/top.html" target="_blank" rel="noopener" class="btn btn-sm" style="text-decoration:none;">気象庁ページを直接開く ↗</a></div>`;
    return;
  }

  const mergedCount = rows.filter(r => r.mergedFrom).length;
  const failNote = (jmaResult.status === 'rejected' ? 'JMA取得失敗（代替プロキシも全滅） ' : '') + (usgsResult.status === 'rejected' ? 'USGS取得失敗' : '');
  statusEl.innerHTML = `${rows.length}件のイベントを取得（うちJMA・USGS統合 ${mergedCount}件）` + (failNote ? ` <span style="color:var(--danger);">／ ${failNote}</span>` : '');
  mechState.rows = rows;
  renderMechList();
}

loadTeichiRegions();
initSharedMap();
initMechView();

</script>
