<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>震析 | 地震学解析ツール</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0d1017;
  --bg-1:#161b24;
  --glass-fill: rgba(255,255,255,0.055);
  --glass-fill-strong: rgba(255,255,255,0.09);
  --glass-border: rgba(255,255,255,0.11);
  --glass-border-strong: rgba(255,255,255,0.18);
  --text-0:#f5f6f8;
  --text-1:#a9adb8;
  --text-2:#6b6f7a;
  --accent:#ff9f43;
  --accent-2:#4fc3f7;
  --accent-mag:#ff5470;
  --danger:#ff4d4f;
  --safe:#39d98a;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
  --font-base: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
.font-num{ font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
html,body{
  height:100%;
  margin:0;
  background:var(--bg-0);
  color:var(--text-0);
  font-family: var(--font-base);
  overflow:hidden;
}
#app{position:relative; width:100vw; height:100vh; height:100dvh;}

.view{
  position:absolute; inset:0;
  visibility:hidden;
  pointer-events:none;
}
.view.active{visibility:visible; pointer-events:auto;}

.glass-panel{
  background:var(--glass-fill);
  backdrop-filter: blur(28px) saturate(170%);
  -webkit-backdrop-filter: blur(28px) saturate(170%);
  border:1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
}

.map-container{position:absolute; inset:0; z-index:1;}

/* ============================================================
   新UIシェル：常設は最小限（トップバー＋隅の丸ボタン群）、
   設定・絞り込みはハンバーガーメニュー（ドロワー）に格納する。
   ============================================================ */

/* ---- トップバー：現在の表示モードと期間だけを常時表示 ---- */
.topbar{
  position:absolute;
  top:0; left:0; right:0;
  z-index:80;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  padding-right:60px;
  padding-top:calc(10px + env(safe-area-inset-top, 0px));
  background:#0d0e12;
  pointer-events:none;
}
.topbar > *{ pointer-events:auto; }

/* ハンバーガーボタンは画面右上端に独立して常時固定する */
.hamburger-fixed{
  position:absolute;
  top:calc(10px + env(safe-area-inset-top, 0px));
  right:12px;
  z-index:81;
}

.brand{
  display:flex; align-items:center; gap:8px;
  font-weight:800; font-size:14px; letter-spacing:0.01em; color:var(--text-0);
  white-space:nowrap;
  flex:0 0 auto;
  padding:8px 12px;
  border-radius:100px;
  background:#20242e;
  border:1px solid rgba(255,255,255,0.28);
  color:var(--text-0);
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
}
.brand-mode{
  font-weight:600; font-size:11.5px; color:#c9cdd5;
  padding:0;
  padding-left:8px;
  margin-left:2px;
  border-left:1px solid rgba(255,255,255,0.24);
  white-space:nowrap;
}

.period-chip{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border-radius:100px;
  background:#20242e;
  border:1px solid rgba(255,255,255,0.28);
  color:var(--text-0);
  font-family:var(--font-base);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  transition:background .15s ease, transform .15s ease;
}
.period-chip:hover{ background:#2a303c; }
.period-chip:active{ transform:scale(0.98); }
.period-chip svg{ width:15px; height:15px; stroke:var(--accent-2); fill:none; stroke-width:2; flex-shrink:0; }
.period-chip .period-text{
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-variant-numeric: tabular-nums;
  color:#d9dce2;
  font-weight:500;
}
.period-chip .period-status-dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--text-2);
  flex-shrink:0;
}
.period-chip .period-status-dot.live{ background:var(--safe); box-shadow:0 0 6px rgba(57,217,138,0.6); }
.period-chip .period-status-dot.loading{ background:var(--accent); animation:pulse-dot 1s ease-in-out infinite; }
@keyframes pulse-dot{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

/* ---- 丸ボタン共通（凡例・ハンバーガー） ---- */
.round-btn{
  flex:0 0 auto;
  width:38px; height:38px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  background:#20242e;
  border:1px solid rgba(255,255,255,0.28);
  color:var(--text-0);
  cursor:pointer;
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  transition:background .15s ease, transform .15s ease;
  position:relative;
}
.round-btn:hover{ background:#2a303c; }
.round-btn:active{ transform:scale(0.94); }
.round-btn svg{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.8; }
.round-btn .badge-dot{
  position:absolute; top:6px; right:6px;
  width:8px; height:8px; border-radius:50%;
  background:var(--accent);
  border:1.5px solid var(--bg-0);
  display:none;
}
.round-btn .badge-dot.show{ display:block; }

/* ---- glass-popover：凡例やb値ツールバーなど、地図上に浮かぶ小パネル共通の見た目 ---- */
.glass-popover{
  background:#0d0e12;
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md, 14px);
  box-shadow:0 8px 28px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
}

/* ---- 凡例ポップオーバー（地図左下の丸ボタンから開く） ---- */
.legend-fab{
  position:absolute;
  left:12px;
  bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  z-index:75;
}
.legend-fab .round-btn{
  background:rgba(13,14,18,0.92);
  border-color:rgba(255,255,255,0.1);
  color:var(--text-0);
}
.legend-fab .round-btn:hover{ background:rgba(24,26,33,0.95); }
.legend-popover{
  position:absolute;
  bottom:48px; left:0;
  min-width:168px;
  max-width:min(300px, calc(100vw - 24px));
  padding:14px;
  transform-origin:bottom left;
  transform:scale(0.92) translateY(6px);
  opacity:0;
  pointer-events:none;
  transition:transform .16s cubic-bezier(.2,.8,.3,1.3), opacity .14s ease;
}
.legend-popover.open{
  transform:scale(1) translateY(0);
  opacity:1;
  pointer-events:auto;
}

/* ---- b値ツールバー内の簡易表示チップ＆詳細ポップオーバー ---- */
.bv-summary-chip{
  display:flex; align-items:center; gap:6px;
  padding:6px 10px;
  border-radius:100px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.14);
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s ease;
}
.bv-summary-chip:hover{ background:rgba(255,255,255,0.1); }
.bv-summary-chip:active{ transform:scale(0.97); }
.bv-summary-chip .bv-summary-dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--text-2); flex-shrink:0;
}
.bv-summary-chip .bv-summary-dot.ok{ background:var(--safe); }
.bv-summary-chip .bv-summary-dot.caution{ background:var(--text-2); }
.bv-summary-chip .bv-summary-dot.warn{ background:var(--accent); }
.bv-summary-chip .bv-summary-dot.danger{ background:var(--danger); box-shadow:0 0 6px rgba(255,77,79,0.6); }
.bv-summary-chip .bv-summary-caret{ width:12px; height:12px; stroke:var(--text-2); fill:none; stroke-width:2.2; transition:transform .18s ease; }
.bv-summary-chip.open .bv-summary-caret{ transform:rotate(180deg); }

.bv-detail-popover{
  position:absolute;
  left:50%; bottom:calc(100% + 10px);
  transform:translateX(-50%) scale(0.94) translateY(6px);
  transform-origin:bottom center;
  width:min(320px, 88vw);
  padding:16px;
  opacity:0;
  pointer-events:none;
  transition:transform .16s cubic-bezier(.2,.8,.3,1.3), opacity .14s ease;
  max-height:min(60vh, 420px);
  overflow-y:auto;
}
.bv-detail-popover.open{
  transform:translateX(-50%) scale(1) translateY(0);
  opacity:1;
  pointer-events:auto;
}

/* ---- ハンバーガーメニュー / ドロワー ---- */
.menu-scrim{
  position:absolute; inset:0;
  z-index:95;
  background:rgba(6,7,10,0.5);
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
}
.menu-scrim.open{ opacity:1; pointer-events:auto; }

.menu-drawer{
  position:absolute;
  top:0; right:0; bottom:0;
  z-index:96;
  width:340px;
  max-width:88vw;
  background:#0d0e12;
  border-left:1px solid rgba(255,255,255,0.12);
  box-shadow:-16px 0 44px rgba(0,0,0,0.5);
  display:flex; flex-direction:column;
  transform:translateX(100%);
  transition:transform .26s cubic-bezier(.2,.7,.3,1);
  overflow:hidden;
}
.menu-drawer.open{ transform:translateX(0); }

.menu-header{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between;
  gap:10px;
  padding:16px 16px;
  padding-top:calc(16px + env(safe-area-inset-top, 0px));
  border-bottom:1px solid var(--glass-border);
}
.menu-header-title{ font-size:15px; font-weight:800; color:var(--text-0); }
.menu-close-btn{
  width:32px; height:32px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  background:transparent;
  border:none;
  color:var(--text-1);
  cursor:pointer;
  transition:background .15s ease;
}
.menu-close-btn:hover{ background:var(--glass-fill); color:var(--text-0); }
.menu-close-btn svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; }

.menu-body{
  flex:1 1 auto;
  overflow-y:auto;
  padding:14px 16px 28px 16px;
  padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
}

/* モード切替（震央分布／b値解析／震源球） */
.mode-switch{
  display:flex; flex-direction:column; gap:6px;
  margin-bottom:18px;
}
.mode-switch-btn{
  display:flex; align-items:center; gap:12px;
  padding:12px 13px;
  border-radius:var(--radius-md);
  border:1px solid rgba(255,255,255,0.09);
  background:#191b21;
  color:var(--text-1);
  font-family:var(--font-base);
  font-size:13.5px; font-weight:700;
  cursor:pointer;
  text-align:left;
  transition:background .15s ease, border-color .15s ease, color .15s ease;
}
.mode-switch-btn svg{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7; flex-shrink:0; }
.mode-switch-btn .mode-switch-sub{
  font-size:11px; font-weight:500; color:var(--text-2);
  margin-top:1px;
}
.mode-switch-btn:hover{ background:#212430; }
.mode-switch-btn.active{
  color:var(--text-0);
  background:rgba(255,159,67,0.16);
  border-color:rgba(255,159,67,0.4);
}
.mode-switch-btn.active svg{ color:var(--accent); }

/* アコーディオンセクション（絞り込み・解析対象領域・b値結果など） */
.menu-section{
  border-radius:var(--radius-md);
  border:1px solid rgba(255,255,255,0.09);
  background:#191b21;
  margin-bottom:10px;
  overflow:hidden;
}
.menu-section-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  width:100%;
  padding:13px 14px;
  background:none; border:none;
  cursor:pointer;
  font-family:var(--font-base);
  color:var(--text-0);
  text-align:left;
}
.menu-section-head-label{
  display:flex; align-items:center; gap:9px;
  font-size:13px; font-weight:700;
}
.menu-section-head-label svg{ width:16px; height:16px; stroke:var(--text-2); fill:none; stroke-width:1.8; flex-shrink:0; }
.menu-section-head-right{ display:flex; align-items:center; gap:8px; }
.menu-section-badge{
  font-size:10.5px; font-weight:700;
  color:var(--accent);
  background:rgba(255,159,67,0.14);
  padding:2px 8px;
  border-radius:100px;
  display:none;
  white-space:nowrap;
}
.menu-section-badge.show{ display:inline-block; }
.menu-section-caret{ width:14px; height:14px; stroke:var(--text-2); fill:none; stroke-width:2; transition:transform .2s ease; flex-shrink:0; }
.menu-section.expanded .menu-section-caret{ transform:rotate(180deg); }
.menu-section-body{
  display:none;
  padding:2px 14px 15px 14px;
  border-top:1px solid var(--glass-border);
  padding-top:13px;
}
.menu-section.expanded .menu-section-body{ display:block; }

.menu-footnote{
  font-size:10.5px; color:var(--text-2); line-height:1.7;
  padding:2px 4px 4px 4px;
}

/* ==== 期間指定：デスクトップ＝チップ直下のポップオーバー / モバイル＝ボトムシート ==== */

/* デスクトップ（既定）：右上の期間チップの下に小さく開くポップオーバー */
.sheet-scrim{
  position:absolute; inset:0;
  z-index:97;
  background:transparent;
  opacity:0;
  pointer-events:none;
}
.sheet-scrim.open{ opacity:1; pointer-events:auto; }

.bottom-sheet{
  position:absolute;
  top:58px; right:12px;
  left:auto; bottom:auto;
  z-index:98;
  width:280px;
  max-width:88vw;
  background:#0d0e12;
  border:1px solid rgba(255,255,255,0.14);
  border-radius:16px;
  box-shadow:0 12px 36px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  padding:16px 16px 16px 16px;
  transform-origin:top right;
  transform:scale(0.94) translateY(-6px);
  opacity:0;
  pointer-events:none;
  transition:transform .18s cubic-bezier(.2,.8,.3,1.2), opacity .15s ease;
}
.bottom-sheet.open{ transform:scale(1) translateY(0); opacity:1; pointer-events:auto; }
.sheet-grabber{ display:none; }
.sheet-title{ font-size:13.5px; font-weight:800; color:var(--text-0); margin-bottom:12px; }

/* モバイル：画面下からのボトムシートに切り替える */
@media (max-width: 640px){
  .sheet-scrim{ background:rgba(6,7,10,0.5); }

  .bottom-sheet{
    position:absolute;
    left:0; right:0; top:auto; bottom:0;
    z-index:98;
    width:auto;
    max-width:420px;
    margin:0 auto;
    border-radius:20px 20px 0 0;
    box-shadow:0 -14px 40px rgba(0,0,0,0.5);
    padding:8px 18px 20px 18px;
    padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    transform:translateY(100%);
    transition:transform .26s cubic-bezier(.2,.7,.3,1);
  }
  .bottom-sheet.open{ transform:translateY(0); }
  .sheet-grabber{
    display:block;
    width:36px; height:4px; border-radius:3px;
    background:rgba(255,255,255,0.2);
    margin:0 auto 14px auto;
  }
  .sheet-title{ font-size:14.5px; margin-bottom:14px; }
}

/* メニュー・シート内で使う汎用フィールドラベル */
.menu-section .field-label,
.bottom-sheet .field-label{ color:var(--text-1); }

@media (max-width: 640px){
  .brand-mode{ display:none; }
  .period-chip .period-text{ font-size:11px; }
}
@media (max-width: 400px){
  .brand span.brand-name-full{ display:none; }
}
#bv-toolbar{ flex-wrap:wrap; justify-content:center; }
@media (max-width: 480px){
  #bv-toolbar #bv-bbox-label{ flex-basis:100%; max-width:100% !important; text-align:center; }
}

.panel-title{
  font-size:11px; font-weight:700; letter-spacing:0.08em;
  color:var(--text-2);
  margin:0 0 10px 0;
  display:flex; align-items:center;
}

label.field-label{
  font-size:11px; color:var(--text-2); display:block; margin-bottom:4px; letter-spacing:0.02em;
}
input[type="number"], select{
  width:100%;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);
  color:var(--text-0);
  padding:8px 10px;
  font-family:var(--font-base);
  font-variant-numeric: tabular-nums;
  font-size:12.5px;
  outline:none;
  transition:border-color .2s;
}
input[type="number"]:focus, select:focus{
  border-color:var(--accent);
}

.date-field{
  display:flex;
  align-items:center;
  gap:3px;
  width:100%;
  height:38px;
  background:#0a0b0e;
  border:1px solid rgba(255,255,255,0.16);
  border-radius:var(--radius-sm);
  padding:0 10px;
  transition:border-color .2s;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
}
.date-field:focus-within{
  border-color:var(--accent);
}
.date-seg{
  box-sizing:border-box;
  height:100%;
  background:transparent;
  border:none;
  outline:none;
  color:#ffffff;
  font-family:var(--font-base);
  font-variant-numeric: tabular-nums;
  font-size:13.5px;
  font-weight:600;
  line-height:normal;
  text-align:center;
  padding:0;
  margin:0;
  vertical-align:middle;
  caret-color:var(--accent);
  transition:color .12s ease;
}
.date-seg::selection{
  background:rgba(255,255,255,0.28);
  color:#ffffff;
}
.date-seg.seg-y{ width:4.2ch; }
.date-seg.seg-m, .date-seg.seg-d{ width:2.2ch; }
.date-seg.seg-hh, .date-seg.seg-mm{ width:2.2ch; }
.date-time-sep{
  display:inline-flex;
  align-items:center;
  height:100%;
  color:rgba(255,255,255,0.3);
  margin:0 1px;
  user-select:none;
}
.date-sep{
  display:inline-flex;
  align-items:center;
  height:100%;
  color:rgba(255,255,255,0.55);
  font-family:var(--font-base);
  font-size:13.5px;
  line-height:normal;
  user-select:none;
}
.date-field-cal-btn{
  margin-left:auto;
  display:flex; align-items:center; justify-content:center;
  width:20px; height:20px;
  background:transparent; border:none; padding:0;
  cursor:pointer;
  opacity:0.7;
  transition:opacity .15s;
  position:relative;
}
.date-field-cal-btn:hover{ opacity:1; }
.date-field-cal-btn svg{ width:15px; height:15px; stroke:#ffffff; fill:none; stroke-width:1.6; }
.date-field-cal-btn input[type="date"]{
  position:absolute; inset:0;
  width:100%; height:100%;
  opacity:0; cursor:pointer;
  border:none; padding:0; margin:0;
  background:transparent;
  font-size:12.5px;
}

select option{
  background:#1a1c22;
  color:var(--text-0);
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:9px 16px;
  border-radius:var(--radius-sm);
  border:1px solid var(--glass-border-strong);
  background:var(--glass-fill-strong);
  color:var(--text-0);
  font-family:var(--font-base);
  font-size:12.5px; font-weight:600;
  cursor:pointer;
  transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
}
.btn:hover{background:rgba(255,255,255,0.14);}
.btn:active{transform:scale(0.97);}
.btn-accent{
  background:var(--accent);
  border-color:rgba(255,159,67,0.5);
  color:#1a0f00;
}
.btn-accent:hover{background:#ffb066;}
.btn:disabled{opacity:0.4; cursor:not-allowed; transform:none;}

.btn-sm{padding:6px 11px; font-size:11px; border-radius:8px;}

.row{display:flex; gap:8px;}
.row > *{flex:1;}

.divider{height:1px; background:var(--glass-border); margin:12px 0;}

::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15); border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

.spinner{
  width:16px; height:16px;
  border:2px solid rgba(255,255,255,0.15);
  border-top-color:var(--accent);
  border-radius:50%;

<script>
'use strict';

const DARK_STYLE = {
  version: 8,
  glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
  sources: {},
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': '#1a2230' } }
  ]
};

const GEOJSON_WORLD_URL = 'world.geojson';
const GEOJSON_PREF_URL = 'prefectures.geojson';
const GEOJSON_PLATE_BOUNDARIES_URL = 'plate-boundaries.geojson';

const JAPAN_CENTER = [138.5, 37.0];

let teichiRegions = null; // 震央地名区分ポリゴン（国内・遠地とも全域これに統一）: [{id, name, polygons: [[[lon,lat],...], ...]}]
let teichiLoadPromise = null;

// 震央地名区分ポリゴンの読み込み (出典: 0Quake/JMA_Region, CC0 / 気象庁「地震情報で用いる震央地名」別紙３準拠)
async function loadTeichiRegions() {
  if (teichiLoadPromise) return teichiLoadPromise;
  teichiLoadPromise = (async () => {
    try {
      const res = await fetch('hypocenter_data.json');
      const geojson = await res.json();
      teichiRegions = geojson.features.map(f => {
        const geom = f.geometry;
        // Polygon: [ring, ...], MultiPolygon: [polygon, ...] = [[ring,...],...]
        const polygons = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
        return { id: f.properties.id, name: f.properties.name, polygons };
      });
    } catch (e) {
      console.error('遠地震央地名データの読み込みに失敗しました:', e);
    }
  })();
  return teichiLoadPromise;
}

// レイシャスティング法による点内判定 (1つのポリゴン=リング配列 [外周, 穴1, 穴2, ...])
function pointInRing(lon, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function pointInPolygon(lon, lat, rings) {
  // rings[0]が外周、rings[1+]が穴。外周に入っていて、どの穴にも入っていなければtrue
  if (!pointInRing(lon, lat, rings[0])) return false;
  for (let k = 1; k < rings.length; k++) {
    if (pointInRing(lon, lat, rings[k])) return false;
  }
  return true;
}

function lookupTeichiName(lon, lat) {
  if (!teichiRegions) return null;
  // データは経度0〜360度表記のため、-180〜180形式の入力を正規化する
  const lon360 = ((lon % 360) + 360) % 360;
  for (const region of teichiRegions) {
    for (const poly of region.polygons) {
      if (pointInPolygon(lon360, lat, poly)) return region.name;
    }
  }
  return null;
}

function toast(msg, ms = 4200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), ms);
}

function pad2(n) { return String(n).padStart(2, '0'); }

function createDateFieldHTML(id, isoValue) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(isoValue || '');
  const y = m ? m[1] : '';
  const mo = m ? m[2] : '';
  const d = m ? m[3] : '';
  const todayIso = defaultDateStr(0);
  return `
    <div class="date-field" data-date-field-id="${id}">
      <input type="hidden" id="${id}" value="${isoValue || ''}">
      <input class="date-seg seg-y" type="text" inputmode="numeric" maxlength="4" placeholder="年" data-seg="y" value="${y}">
      <span class="date-sep">/</span>
      <input class="date-seg seg-m" type="text" inputmode="numeric" maxlength="2" placeholder="月" data-seg="m" value="${mo}">
      <span class="date-sep">/</span>
      <input class="date-seg seg-d" type="text" inputmode="numeric" maxlength="2" placeholder="日" data-seg="d" value="${d}">
      <button type="button" class="date-field-cal-btn" title="カレンダーから選択">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <input type="date" tabindex="-1" aria-hidden="true" value="${isoValue || ''}" max="${todayIso}">
      </button>
    </div>`;
}

function bindDateField(id, onChange) {
  const root = document.querySelector(`.date-field[data-date-field-id="${id}"]`);
  if (!root) return;
  const hidden = document.getElementById(id);
  const segY = root.querySelector('[data-seg="y"]');
  const segM = root.querySelector('[data-seg="m"]');
  const segD = root.querySelector('[data-seg="d"]');
  const calInput = root.querySelector('.date-field-cal-btn input[type="date"]');

  function currentIso() {
    const y = segY.value.trim();
    const mo = segM.value.trim();
    const d = segD.value.trim();
    if (y.length === 4 && mo.length >= 1 && d.length >= 1) {
      const isoStr = `${y}-${pad2(Number(mo))}-${pad2(Number(d))}`;
      const dt = new Date(isoStr + 'T00:00:00');
      if (!isNaN(dt) && dt.getFullYear() === Number(y) && dt.getMonth() + 1 === Number(mo) && dt.getDate() === Number(d)) {
        return isoStr;
      }
    }
    return '';
  }

  const todayIso = defaultDateStr(0);
  function clampToToday(iso) {
    if (iso && iso > todayIso) return todayIso;
    return iso;
  }

  function commit() {
    let iso = currentIso();
    const clamped = clampToToday(iso);
    if (clamped !== iso && clamped) {
      iso = clamped;
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
      segY.value = m[1]; segM.value = m[2]; segD.value = m[3];
    }
    hidden.value = iso;
    if (calInput) calInput.value = iso;
    if (onChange) onChange(iso);
  }

  function wireSegment(el, maxLen, next) {
    el.addEventListener('input', () => {
      const digits = el.value.replace(/\D/g, '').slice(0, maxLen);
      el.value = digits;
      if (digits.length >= maxLen && next) next.focus();
      commit();
    });
    el.addEventListener('blur', () => {
      if (el.dataset.seg !== 'y' && el.value.length === 1) {
        el.value = pad2(Number(el.value));
      }
      commit();
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && el.selectionStart === 0 && el.selectionEnd === 0) {
        const prev = el === segD ? segM : (el === segM ? segY : null);
        if (prev) { prev.focus(); prev.setSelectionRange(prev.value.length, prev.value.length); }
      }
    });
    el.addEventListener('focus', () => { el.select(); });
  }
  wireSegment(segY, 4, segM);
  wireSegment(segM, 2, segD);
  wireSegment(segD, 2, null);

  if (calInput) {
    calInput.addEventListener('change', () => {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(calInput.value || '');
      if (m) {
        segY.value = m[1]; segM.value = m[2]; segD.value = m[3];
        commit();
      }
    });
  }
}

function getDateFieldValue(id) {
  const el = document.getElementById(id);
  return el ? el.value : '';
}

// --- 日時（YYYY/MM/DD HH:MM）を1行にまとめた入力フィールド ---
// hiddenの値は "YYYY-MM-DDTHH:MM" 形式で保持する。
function createDateTimeFieldHTML(id, isoDate, hhmm) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(isoDate || '');
  const y = m ? m[1] : '';
  const mo = m ? m[2] : '';
  const d = m ? m[3] : '';
  const tm = /^(\d{2}):(\d{2})$/.exec(hhmm || '');
  const hh = tm ? tm[1] : '';
  const mm = tm ? tm[2] : '';
  const todayIso = defaultDateStr(0);
  const combined = (isoDate && hhmm) ? `${isoDate}T${hhmm}` : '';
  return `
    <div class="date-field" data-datetime-field-id="${id}">
      <input type="hidden" id="${id}" value="${combined}">
      <input class="date-seg seg-y" type="text" inputmode="numeric" maxlength="4" placeholder="年" data-seg="y" value="${y}">
      <span class="date-sep">/</span>
      <input class="date-seg seg-m" type="text" inputmode="numeric" maxlength="2" placeholder="月" data-seg="m" value="${mo}">
      <span class="date-sep">/</span>
      <input class="date-seg seg-d" type="text" inputmode="numeric" maxlength="2" placeholder="日" data-seg="d" value="${d}">
      <span class="date-time-sep">&nbsp;</span>
      <input class="date-seg seg-hh" type="text" inputmode="numeric" maxlength="2" placeholder="時" data-seg="hh" value="${hh}">
      <span class="date-sep">:</span>
      <input class="date-seg seg-mm" type="text" inputmode="numeric" maxlength="2" placeholder="分" data-seg="mm" value="${mm}">
      <button type="button" class="date-field-cal-btn" title="カレンダーから選択">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <input type="date" tabindex="-1" aria-hidden="true" value="${isoDate || ''}" max="${todayIso}">
      </button>
    </div>`;
}

function bindDateTimeField(id, onChange) {
  const root = document.querySelector(`.date-field[data-datetime-field-id="${id}"]`);
  if (!root) return;
  const hidden = document.getElementById(id);
  const segY = root.querySelector('[data-seg="y"]');
  const segM = root.querySelector('[data-seg="m"]');
  const segD = root.querySelector('[data-seg="d"]');
  const segHH = root.querySelector('[data-seg="hh"]');
  const segMM = root.querySelector('[data-seg="mm"]');
  const calInput = root.querySelector('.date-field-cal-btn input[type="date"]');

  function currentIsoDate() {
    const y = segY.value.trim();
    const mo = segM.value.trim();
    const d = segD.value.trim();
    if (y.length === 4 && mo.length >= 1 && d.length >= 1) {
      const isoStr = `${y}-${pad2(Number(mo))}-${pad2(Number(d))}`;
      const dt = new Date(isoStr + 'T00:00:00');
      if (!isNaN(dt) && dt.getFullYear() === Number(y) && dt.getMonth() + 1 === Number(mo) && dt.getDate() === Number(d)) {
        return isoStr;
      }
    }
    return '';
  }

  function currentHHMM() {
    const hh = segHH.value.trim();
    const mm = segMM.value.trim();
    if (hh.length >= 1 && mm.length >= 1) {
      const h = Number(hh), mi = Number(mm);
      if (!isNaN(h) && !isNaN(mi) && h >= 0 && h <= 23 && mi >= 0 && mi <= 59) {
        return `${pad2(h)}:${pad2(mi)}`;
      }
    }
    return '';
  }

  const todayIso = defaultDateStr(0);
  function clampToToday(iso) {
    if (iso && iso > todayIso) return todayIso;
    return iso;
  }

  function commit() {
    let iso = currentIsoDate();
    const clamped = clampToToday(iso);
    if (clamped !== iso && clamped) {
      iso = clamped;
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
      segY.value = m[1]; segM.value = m[2]; segD.value = m[3];
    }
    const hhmm = currentHHMM();
    hidden.value = (iso && hhmm) ? `${iso}T${hhmm}` : '';
    if (calInput) calInput.value = iso;
    if (onChange) onChange(hidden.value);
  }

  function wireDigitsSegment(el, maxLen, next, maxVal) {
    el.addEventListener('input', () => {
      let digits = el.value.replace(/\D/g, '').slice(0, maxLen);
      el.value = digits;
      if (digits.length >= maxLen && next) next.focus();
      commit();
    });
    el.addEventListener('blur', () => {
      if (el.value.length === 1) el.value = pad2(Number(el.value));
      if (maxVal != null && el.value !== '' && Number(el.value) > maxVal) el.value = pad2(maxVal);
      commit();
    });
    el.addEventListener('focus', () => { el.select(); });
  }
  wireDigitsSegment(segY, 4, segM, null);
  wireDigitsSegment(segM, 2, segD, null);
  wireDigitsSegment(segD, 2, segHH, null);
  wireDigitsSegment(segHH, 2, segMM, 23);
  wireDigitsSegment(segMM, 2, null, 59);

  // Backspaceで前セグメントへ戻る（年→月→日→時→分の連結感を出す）
  [[segM, segY], [segD, segM], [segHH, segD], [segMM, segHH]].forEach(([el, prev]) => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && el.selectionStart === 0 && el.selectionEnd === 0) {
        prev.focus(); prev.setSelectionRange(prev.value.length, prev.value.length);
      }
    });
  });

  if (calInput) {
    calInput.addEventListener('change', () => {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(calInput.value || '');
      if (m) {
        segY.value = m[1]; segM.value = m[2]; segD.value = m[3];
        commit();
      }
    });
  }
}

// 戻り値: { date: "YYYY-MM-DD", time: "HH:MM" }（未入力部分は空文字）

// （dailyMapCutoffDate()参照）。
function dailyMapUrlFor(dateObj) {

// 「使用時（今日）の何日前か」を起点に、hypo_dataアーカイブ・daily_map・bosai/hypoの
// 3ソースへの日付振り分け境界を求める。
//   - 静的アーカイブ（hypo_data）: 〜2025/5/31（HYPO_ARCHIVESのendMsで判定）
//   - daily_map: アーカイブ終端の翌日 〜 今日の8日前
//   - bosai/hypo（直近フィード）: 今日の7日前 〜 今日
function dailyMapCutoffDate() {
  // 今日の7日前の0時。この日以降（7日前〜今日）はbosai/hypoを使う。
  const today = new Date();
  const cutoff = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  cutoff.setDate(cutoff.getDate() - 7);
  return cutoff;
}

function isDailyMapCoveredDate(dateObj) {
  const y = dateObj.getFullYear(), mo = dateObj.getMonth(), d = dateObj.getDate();
  const startOfDay = new Date(y, mo, d, 0, 0, 0, 0).getTime();
  const dailyMapCutoffMs = dailyMapCutoffDate().getTime();
  // アーカイブ範囲より後、かつ「今日の7日前」より前ならdaily_map対象。
  return startOfDay > HYPO_ARCHIVE_CUTOFF_MS && startOfDay < dailyMapCutoffMs;
}

function dateRange(startStr, endStr) {
  const out = [];
  const start = new Date(startStr + 'T00:00:00');
  const end = new Date(endStr + 'T00:00:00');
  if (isNaN(start) || isNaN(end) || start > end) return out;
  const cur = new Date(start);
  while (cur <= end) {
    out.push(new Date(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

// Safari/iOSのDateパースはChrome/V8よりも仕様に厳格で、以下のような文字列を
// Invalid Dateとして扱うことがある（Chromeでは通ってしまうため気づきにくい）：
//   - "2026-07-06 14:23:45"（Tではなくスペース区切り）
//   - "2026-07-06T14:23:45"（タイムゾーン情報なし。Safariにより解釈が割れる）
//   - "2026/07/06 14:23:45"（スラッシュ区切り + スペース）
// JMAの各種GeoJSON/JSON APIはエンドポイントによって微妙にtimeの書式が異なるため、
// `new Date(raw)` に丸投げせず、まず正規表現でパースを試みてからフォールバックする。
function parseTimeRobust(raw) {
  if (raw == null) return null;

  // すでに数値（epoch ms）ならそのまま使う
  if (typeof raw === 'number') {
    return isNaN(raw) ? null : raw;
  }

  const s = String(raw).trim();
  if (!s) return null;

  // JMAの一部エンドポイント（hypoなど）は "YYYY/MM/DD.HH:MM:SS.ss" という独特の書式を使う。
  // 例: "2026/07/01.21:08:28.68"
  //   - 日付区切りは "/"
  //   - 日付と時刻の区切りが "T" でも半角スペースでもなく "." (ピリオド)
  //   - 秒の小数部も "." 区切りで、ミリ秒ではなく百分の1秒（2桁）
  // Chrome(V8)のDateパーサはこれを緩く解釈できてしまうが、Safari/WebKitでは
  // Invalid Dateになる。タイムゾーン情報は無いのでJST（気象庁データの慣習）とみなす。
  // 秒（および小数秒）は省略されることがある（例: "2026/09/12.05:55"）ため、
  // ":(\d{2})" 以降を丸ごとオプションにしてマッチさせる。
  const mJmaDot = /^(\d{4})\/(\d{2})\/(\d{2})\.(\d{2}):(\d{2})(?::(\d{2})(?:\.(\d+))?)?$/.exec(s);
  if (mJmaDot) {
    const [, y, mo, d, h, mi, sec, frac] = mJmaDot;
    // frac は "68" のような百分の1秒表記のことが多いため、桁数に応じてミリ秒に変換する
    let fracMs = 0;
    if (frac) {
      fracMs = Math.round(Number(`0.${frac}`) * 1000);
    }
    const utcMs = Date.UTC(Number(y), Number(mo) - 1, Number(d), Number(h), Number(mi), Number(sec || 0))
      - 9 * 60 * 60 * 1000;
    return utcMs + fracMs;
  }

  // "YYYY-MM-DD(T|space)HH:mm:ss(.sss)?(Z|+09:00|+0900)?" 形式を明示的にパースする。
  // タイムゾーンが無い場合はJST（+09:00）とみなす。JMAのデータは基本的に日本時間のため。
  const m = /^(\d{4})[-/](\d{2})[-/](\d{2})[T\s](\d{2}):(\d{2})(?::(\d{2}(?:\.\d+)?))?\s*(Z|[+-]\d{2}:?\d{2})?$/.exec(s);
  if (m) {
    const [, y, mo, d, h, mi, sec, tz] = m;
    const secNum = sec ? parseFloat(sec) : 0;
    if (!tz) {
      // タイムゾーン情報なし → JSTとして扱う（UTCに変換してからepoch msを求める）
      const utcMs = Date.UTC(Number(y), Number(mo) - 1, Number(d), Number(h), Number(mi), Math.floor(secNum))
        - 9 * 60 * 60 * 1000;
      return utcMs + (secNum % 1) * 1000;
    }
    // タイムゾーンが明示されている場合はISO文字列として組み立て直し、
    // Safariが確実にパースできる "T"区切り・コロン付きオフセット形式に正規化する。
    let tzNorm = tz;
    if (tzNorm !== 'Z' && !tzNorm.includes(':')) {
      tzNorm = `${tzNorm.slice(0, 3)}:${tzNorm.slice(3)}`;
    }
    const isoStr = `${y}-${mo}-${d}T${h}:${mi}:${sec || '00'}${tzNorm}`;
    const t = new Date(isoStr);
    if (!isNaN(t.getTime())) return t.getTime();
  }

  // 上記パターンに合わなかった場合は素直に Date に渡す（YYYYMMDDHHMMSSの数値文字列や
  // 既にブラウザ非依存な形式である可能性があるため）。ただし "-" を "/" に置換したり、
  // スペースを "T" に置換した版も試し、Safariで弾かれるケースを追加でカバーする。
  const candidates = [s, s.replace(' ', 'T'), s.replace(/\//g, '-')];
  for (const c of candidates) {
    const t = new Date(c);
    if (!isNaN(t.getTime())) return t.getTime();
  }
  return null;
}

function pickProp(props, keys, fallback = null) {
  for (const k of keys) {
    if (props[k] !== undefined && props[k] !== null) return props[k];
  }
  return fallback;
}

function normalizeFeature(feature) {
  const p = feature.properties || {};
  const coords = (feature.geometry && feature.geometry.coordinates) || [null, null, null];
  const lon = coords[0];
  const lat = coords[1];
  let depth = coords[2];
  if (depth === undefined || depth === null) {
    const depRaw = pickProp(p, ['dep', 'depth'], null);
    depth = depRaw !== null ? Number(depRaw) : null;
  }
  if (depth !== undefined && depth !== null && !isNaN(depth) && depth < 0) depth = -depth;
  if (depth !== null && isNaN(depth)) depth = null;

  const mag = Number(pickProp(p, ['mag', 'magnitude', 'Magunitude', 'M'], NaN));
  const timeRaw = pickProp(p, ['time', 'origin_time', 'at', 'date'], null);
  const placeRaw = pickProp(p, ['place', 'epi', 'region', 'name'], null);
  const placeByCoord = lookupTeichiName(lon, lat);
  const place = placeByCoord || placeRaw || (lon != null && lat != null && !isNaN(lon) && !isNaN(lat) ? '遠地地震' : '不明');
  const maxInt = pickProp(p, ['maxInt', 'max_int', 'maxi', 'intensity'], null);

  const timeMs = parseTimeRobust(timeRaw);
  if (timeRaw != null && timeMs == null) {
    // Safari/Chrome問わず、想定外の書式が来た場合はコンソールに残す。
    // モバイルでだけ時刻が空欄になる系の不具合はここで気づける。
    console.warn('地震時刻のパースに失敗しました:', timeRaw);
  }

  return {
    lon, lat, depth,
    mag: isNaN(mag) ? null : mag,
    time: timeMs,
    timeRaw,
    place,
    maxInt,
    raw: p
  };
}

// ------------------------------------------------------------------
// 静的アーカイブ群
// 以下の期間はすべて静的アーカイブ（改行区切りJSON＝NDJSON、.gz圧縮）から読み込み、
// JMAの日別geojsonエンドポイントへのライブfetchは行わない。
// レコード形式は {time, lat, lon, dep, mag, name} を1行1レコードで並べたNDJSONで、
// normalizeFeature() が期待する GeoJSON Feature 形状（properties / geometry）
// に変換してから既存の正規化ロジックに通す。
//
// 各アーカイブの startMs/endMs はファイル名ではなく中身の実データで判定するべき
// （過去にファイル名の年代表記と中身が食い違っていた事故があったため、
//  ここでは実際にカバーする日付範囲を明示的に持たせている）。
// ------------------------------------------------------------------
// このアプリは日本国内での利用を前提とし、期間指定UIやdayKey()は
// すべて「ブラウザのローカルタイムゾーン＝JST」という前提でnew Date(y,m,d)を使っている。
// アーカイブの境界もこれに合わせてローカルTZ基準のnew Date(y,m,d,...)で定義することで、
// 一部環境（JST以外のOS設定やNode.jsでのテスト実行）でのタイムゾーン二重変換によるズレを防ぐ。
const HYPO_ARCHIVES = [
  {
    url: 'hypo_data/jma_hypocenters.json.gz',
    startMs: new Date(2024, 0, 1, 0, 0, 0, 0).getTime(),
    // 実データは2025年5月末までしか含まれていないため、終端をここに合わせる。
    // 2025/6/1以降は daily_map（日別震源リストページ）にソースを切り替える。
    endMs: new Date(2025, 4, 31, 23, 59, 59, 999).getTime()
  },
  // 2013/03/23〜2023/12/31（JST）分。独自バイナリ形式（1レコード可変長、gzip圧縮）。
  // 507万件規模のカタログを25MB未満(gz込み)に収めるため、NDJSONではなく
  // 固定長カラム＋差分エンコードの専用バイナリで持っている（decodeHypoBinary参照）。
  {
    url: 'hypo_data/hypo_data2.bin.gz',
    format: 'bin',
    startMs: new Date(2013, 2, 23, 0, 0, 0, 0).getTime(),
    endMs: new Date(2023, 11, 31, 23, 59, 59, 999).getTime()
  },
  // 1919/01/01〜2013/03/22（JST）分。上と同じ独自バイナリ形式。
  {
    url: 'hypo_data/hypo_data1.bin.gz',
    format: 'bin',
    startMs: new Date(1919, 0, 1, 0, 0, 0, 0).getTime(),
    endMs: new Date(2013, 2, 22, 23, 59, 59, 999).getTime()
  }
];

// 全アーカイブの中で最も新しい終端（このタイムスタンプ以前は必ずどれかのアーカイブでカバーされる）
const HYPO_ARCHIVE_CUTOFF_MS = Math.max(...HYPO_ARCHIVES.map(a => a.endMs));
// 全アーカイブの中で最も古い開始（これより前は静的アーカイブ非対応）
const HYPO_ARCHIVE_MIN_MS = Math.min(...HYPO_ARCHIVES.map(a => a.startMs));

const hypoArchiveLoadPromises = new Map(); // url -> Promise

function archiveRecordToFeature(rec) {
  return {
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [rec.lon, rec.lat, rec.dep] },
    properties: {
      time: rec.time,
      mag: rec.mag,
      name: rec.name,
      dep: rec.dep
    }
  };
}

// ------------------------------------------------------------------
// 独自バイナリ形式（hypo_data*.bin.gz）のデコーダ
//
// 507万件規模の震源カタログをテキスト/JSONで持つと巨大になりすぎるため、
// 固定長カラム＋差分エンコードの独自バイナリで保持している。
// フォーマット（すべてリトルエンディアン）:
//   int32  recordCount (N)
//   int32  firstTs（Unix秒）
//   [N-1] タイムスタンプ差分列:
//     uint16 deltaOrEscape
//       0xFFFF の場合はエスケープで、続けて int32 実差分値が入る
//       それ以外はそのまま ts[i] = ts[i-1] + deltaOrEscape
//   [N]   int16  lat_x100（緯度 * 100、精度0.01度のまま欠損なし）
//   [N]   int16  lon_x100（経度 * 100、精度0.01度のまま欠損なし）
//   [N]   depth列:
//     uint16 depthOrEscape（深さ_km * 100）
//       0xFFFF の場合はエスケープで、続けて int32 実値（depth_km*100）が入る
//   [N]   int16  mag_x10（マグニチュード * 10、-999 はマグニチュード欠損を表すセンチネル）
//
// レコードは ts 昇順にソート済みが前提。緯度経度は小数点2桁、深さは小数点2桁、
// マグニチュードは小数点1桁の精度をすべて可逆で保持している（丸めによる情報欠落なし）。
function decodeHypoBinary(buf) {
  const dv = new DataView(buf);
  let off = 0;
  const n = dv.getInt32(off, true); off += 4;
  const firstTs = dv.getInt32(off, true); off += 4;

  const ts = new Int32Array(n);
  ts[0] = firstTs;
  for (let i = 1; i < n; i++) {
    let delta = dv.getUint16(off, true); off += 2;
    if (delta === 0xFFFF) {
      delta = dv.getInt32(off, true); off += 4;
    }
    ts[i] = ts[i - 1] + delta;
  }

  const lat = new Int16Array(n);
  for (let i = 0; i < n; i++) { lat[i] = dv.getInt16(off, true); off += 2; }

  const lon = new Int16Array(n);
  for (let i = 0; i < n; i++) { lon[i] = dv.getInt16(off, true); off += 2; }

  const depth = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    let d = dv.getUint16(off, true); off += 2;
    if (d === 0xFFFF) {
      d = dv.getInt32(off, true); off += 4;
    }
    depth[i] = d;
  }

  const mag = new Int16Array(n);
  for (let i = 0; i < n; i++) { mag[i] = dv.getInt16(off, true); off += 2; }

  return { n, ts, lat, lon, depth, mag };
}

// バイナリのデコード結果1件分を、normalizeFeature() の出力と同じ形状に直接組み立てる。
// （GeoJSON Featureを経由せず、パース済み数値からそのまま構築することで無駄なJSON化を避ける）
function hypoBinaryRecordToNormalized(cols, i) {
  const lonV = cols.lon[i] / 100;
  const latV = cols.lat[i] / 100;
  const depthV = cols.depth[i] / 100;
  const magRaw = cols.mag[i];
  const magV = magRaw === -999 ? null : magRaw / 10;
  const timeMs = cols.ts[i] * 1000;

  const placeByCoord = lookupTeichiName(lonV, latV);
  const place = placeByCoord || (lonV != null && latV != null && !isNaN(lonV) && !isNaN(latV) ? '遠地地震' : '不明');

  return {
    lon: lonV,
    lat: latV,
    depth: depthV,
    mag: magV,
    time: timeMs,
    timeRaw: null,
    place,
    maxInt: null,
    raw: null
  };
}

// JST基準の "YYYY-MM-DD" 日付キーをUnix秒（UTC）から求める。
// 既存のdayKey()はローカルTZ前提のDateオブジェクトから作るが、
// バイナリはUTC epoch秒しか持たないため、+9時間したうえでUTC基準の年月日を取り出す。
function dayKeyFromUtcSeconds(tsSec) {
  const jstMs = tsSec * 1000 + 9 * 60 * 60 * 1000;
  const d = new Date(jstMs);
  const y = d.getUTCFullYear();
  const mo = pad2(d.getUTCMonth() + 1);
  const da = pad2(d.getUTCDate());
  return `${y}-${mo}-${da}`;
}

async function loadHypoArchiveBinaryFile(archive) {
  const res = await fetch(archive.url);
  if (!res.ok) throw new Error(`HTTP ${res.status} @ ${archive.url}`);
  const ab = await res.arrayBuffer();

  let bin;
  try {
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([ab]).stream().pipeThrough(ds);
    bin = await new Response(stream).arrayBuffer();
  } catch (e) {
    // 解凍済みの生バイナリが返ってきた場合のフォールバック
    bin = ab;
  }

  const cols = decodeHypoBinary(bin);

  const byDay = new Map();
  for (let i = 0; i < cols.n; i++) {
    const feat = hypoBinaryRecordToNormalized(cols, i);
    const key = dayKeyFromUtcSeconds(cols.ts[i]);
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(feat);
  }
  for (const [key, feats] of byDay) {
    hypoDayCache.set(key, { features: feats, error: null });
  }
  console.log(`バイナリアーカイブ読み込み完了 (${archive.url}): ${cols.n}件 / ${byDay.size}日分`);
  return byDay;
}

// NDJSON（1行1レコード）を優先してパースし、ダメなら単一JSON配列としてフォールバックする。
function parseHypoArchiveText(text) {
  const trimmed = text.trim();
  // 先頭が '[' なら単一JSON配列とみなす
  if (trimmed.startsWith('[')) {
    return JSON.parse(trimmed);
  }
  // それ以外はNDJSONとして1行ずつパースする（空行はスキップ、壊れた行は無視して継続）
  const records = [];
  const lines = trimmed.split('\n');
  for (const line of lines) {
    const l = line.trim();
    if (!l) continue;
    try {
      records.push(JSON.parse(l));
    } catch (e) {
      // 壊れた行はスキップして続行（アーカイブ全体を無効化しない）
      console.warn('アーカイブ行のパースに失敗（スキップ）:', l.slice(0, 100), e);
    }
  }
  return records;
}

async function loadHypoArchiveFile(archive) {
  if (hypoArchiveLoadPromises.has(archive.url)) return hypoArchiveLoadPromises.get(archive.url);
  const promise = (async () => {
    // 独自バイナリ形式（hypo_data*.bin.gz）は専用デコーダへ分岐する。
    // NDJSON.gzとフォーマットが根本的に違うため、テキスト経由にせず直接ArrayBufferを扱う。
    if (archive.format === 'bin') {
      return loadHypoArchiveBinaryFile(archive);
    }

    const res = await fetch(archive.url);
    if (!res.ok) throw new Error(`HTTP ${res.status} @ ${archive.url}`);

    // .gz は DecompressionStream('gzip') でその場に解凍する（追加ライブラリ不要）。
    // 非対応ブラウザ向けに、解凍済みの生テキストが返ってきた場合のフォールバックも用意する。
    let text;
    const ab = await res.arrayBuffer();
    try {
      const ds = new DecompressionStream('gzip');
      const stream = new Blob([ab]).stream().pipeThrough(ds);
      text = await new Response(stream).text();
    } catch (e) {
      text = new TextDecoder('utf-8').decode(ab);
    }

    const records = parseHypoArchiveText(text);

    // 日付ごとにグルーピングしてhypoDayCacheへ事前投入する
    const byDay = new Map();
    for (const rec of records) {
      const feat = normalizeFeature(archiveRecordToFeature(rec));
      if (feat.lon == null || feat.lat == null) continue;
      // "YYYY/MM/DD HH:MM:SS" の先頭10文字 → "YYYY/MM/DD" → "YYYY-MM-DD"
      const key = String(rec.time).slice(0, 10).replace(/\//g, '-');
      if (!byDay.has(key)) byDay.set(key, []);
      byDay.get(key).push(feat);
    }
    for (const [key, feats] of byDay) {
      hypoDayCache.set(key, { features: feats, error: null });
    }
    console.log(`アーカイブ読み込み完了 (${archive.url}): ${records.length}件 / ${byDay.size}日分`);
    return byDay;
  })();
  hypoArchiveLoadPromises.set(archive.url, promise);
  return promise;
}

// ------------------------------------------------------------------
// 日別震源リストページ（daily_map）からの取得・パース
// 2025/6/1〜「今日の8日前」の期間はこちらを使う（isDailyMapCoveredDate参照）。
// ページ内の震源リストは固定幅テキストブロック（<pre>相当）で、1行1レコード：
//   "YYYY  M D HH:MM SS.s  DD°MM.M'N/S DDD°MM.M'E/W  DEPTH   MAG  PLACE"
// 深さ・Ｍが不明の場合は "-" になる。JMAはCORS制限がないため直接fetchする。
// ------------------------------------------------------------------
const DAILY_MAP_LINE_RE =
  /(\d{4})\s+(\d{1,2})\s+(\d{1,2})\s+(\d{1,2}):(\d{2})\s+([\d.]+)\s+(\d{1,3})°\s*([\d.]+)'([NS])\s+(\d{1,3})°\s*([\d.]+)'([EW])\s+(-|\d+)\s+(-|-?[\d.]+)\s+(\S[^\n]*?)(?=\s{2,}|\d{4}\s+\d{1,2}\s+\d{1,2}\s+\d{1,2}:\d{2}\s+[\d.]+\s+\d|\n|$)/g;

function dmsToDecimal(deg, min, hemi) {
  const v = Number(deg) + Number(min) / 60;
  return (hemi === 'S' || hemi === 'W') ? -v : v;
}

function parseDailyMapText(text, dateObj) {
  const feats = [];
  DAILY_MAP_LINE_RE.lastIndex = 0;
  let m;
  while ((m = DAILY_MAP_LINE_RE.exec(text)) !== null) {
    const [, y, mo, d, hh, mi, ss, latDeg, latMin, latHemi, lonDeg, lonMin, lonHemi, depthStr, magStr, placeRaw] = m;
    const lat = dmsToDecimal(latDeg, latMin, latHemi);
    const lon = dmsToDecimal(lonDeg, lonMin, lonHemi);
    const depth = depthStr === '-' ? null : Number(depthStr);
    const mag = magStr === '-' ? null : Number(magStr);
    const place = (placeRaw || '').trim() || null;

    // 秒は小数を含むことがあるため切り捨てて整数秒として扱う（ミリ秒精度は元データ側で不要）。
    const secInt = Math.floor(Number(ss));
    const utcMs = Date.UTC(Number(y), Number(mo) - 1, Number(d), Number(hh), Number(mi), secInt) - 9 * 60 * 60 * 1000;

    const placeByCoord = lookupTeichiName(lon, lat);
    const finalPlace = placeByCoord || place || (lon != null && lat != null && !isNaN(lon) && !isNaN(lat) ? '遠地地震' : '不明');

    feats.push({
      lon, lat,
      depth: depth != null && !isNaN(depth) ? depth : null,
      mag: mag != null && !isNaN(mag) ? mag : null,
      time: utcMs,
      timeRaw: null,
      place: finalPlace,
      maxInt: null,
      raw: null
    });
  }
  return feats;
}

async function fetchDailyMapDay(dateObj, { signal } = {}) {
  const url = dailyMapUrlFor(dateObj);
  const res = await fetch(url, { signal });
  if (!res.ok) throw new Error(`HTTP ${res.status} @ ${url}`);
  const html = await res.text();
  // 震源リストは <pre> や <details> などのブロック内に生テキストで入っているが、
  // 正規表現自体がレコードパターンにしかマッチしないため、HTMLタグ混在下でも
  // 実用上は安全に動作する。念のためHTMLエンティティだけデコードしておく。
  const text = html
    .replace(/&deg;/g, '°')
    .replace(/&#176;/g, '°')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>');
  return parseDailyMapText(text, dateObj);
}

function archiveForDate(dateObj) {
  // 境界（HYPO_ARCHIVES の startMs/endMs）もローカルTZ基準で定義しているため、
  // ここも同じくローカルTZの年月日でその日の開始・終了瞬間を求める。
  const y = dateObj.getFullYear(), mo = dateObj.getMonth(), d = dateObj.getDate();
  const startOfDay = new Date(y, mo, d, 0, 0, 0, 0).getTime();
  const endOfDay = new Date(y, mo, d, 23, 59, 59, 999).getTime();
  return HYPO_ARCHIVES.find(a => startOfDay >= a.startMs && endOfDay <= a.endMs) || null;
}

function isArchiveCoveredDate(dateObj) {
  return archiveForDate(dateObj) != null;
}

async function fetchHypoDay(dateObj, { signal } = {}) {
  await loadTeichiRegions();

  const archive = archiveForDate(dateObj);
  if (archive) {
    await loadHypoArchiveFile(archive);
    const cached = hypoDayCache.get(dayKey(dateObj));
    return cached ? cached.features : [];
  }

  if (isDailyMapCoveredDate(dateObj)) {
    return fetchDailyMapDay(dateObj, { signal });
  }

  const url = hypoUrlFor(dateObj);
  const res = await fetch(url, { signal, mode: 'cors' });
  if (!res.ok) throw new Error(`HTTP ${res.status} @ ${url}`);
  const gj = await res.json();
  const feats = (gj.features || []).map(normalizeFeature).filter(f => f.lon != null && f.lat != null);
  return feats;
}

async function fetchHypoRange(dates, onProgress) {
  const all = [];
  let done = 0;
  let cacheHits = 0;
  const errors = [];
  for (const d of dates) {
    const key = dayKey(d);
    const cached = hypoDayCache.get(key);
    if (cached) {
      const isToday = key === dayKey(new Date());
      if (!isToday) {
        if (cached.error) errors.push({ date: d, error: cached.error });
        else all.push(...cached.features);
        done++; cacheHits++;
        if (onProgress) onProgress(done, dates.length, errors, cacheHits);
        continue;
      }
    }
    try {
      const feats = await fetchHypoDay(d);
      hypoDayCache.set(key, { features: feats, error: null });
      all.push(...feats);
    } catch (e) {
      hypoDayCache.set(key, { features: [], error: e });
      errors.push({ date: d, error: e });
    }
    done++;
    if (onProgress) onProgress(done, dates.length, errors, cacheHits);
  }
  return { features: all, errors, cacheHits };
}

function isRangeFullyCached(dates) {
  const todayKey = dayKey(new Date());
  return dates.every(d => {
    const key = dayKey(d);
    return key !== todayKey && hypoDayCache.has(key);
  });
}

function buildFromCache(dates) {
  const all = [];
  const errors = [];
  for (const d of dates) {
    const cached = hypoDayCache.get(dayKey(d));
    if (!cached) continue;
    if (cached.error) errors.push({ date: d, error: cached.error });
    else all.push(...cached.features);
  }
  return { features: all, errors };
}

let sharedMap = null;
let sharedDateRange = { startDate: null, endDate: null, startTime: null, endTime: null, rawFeatures: null };

// M・深さによる絞り込み条件（震央マップ表示全体に適用）。
// null は「絞り込みなし（無制限）」を意味する。
// M不明・深さ不明（-1センチネル）のfeatureは、時刻不明と同様に絞り込み対象外として常に含める
// （除外すると原因不明のデータ欠落に見えてしまうため）。
let magDepthFilter = { minMag: null, maxMag: null, minDepth: null, maxDepth: null };

function filterFeaturesByMagDepth(features) {
  const { minMag, maxMag, minDepth, maxDepth } = magDepthFilter;
  if (minMag == null && maxMag == null && minDepth == null && maxDepth == null) return features;
  return features.filter(f => {
    if (f.mag != null) {
      if (minMag != null && f.mag < minMag) return false;
      if (maxMag != null && f.mag > maxMag) return false;
    }
    if (f.depth != null && !isNaN(f.depth)) {
      if (minDepth != null && f.depth < minDepth) return false;
      if (maxDepth != null && f.depth > maxDepth) return false;
    }
    return true;
  });
}

// 「現在の日時フィルタ済みfeatures」にM・深さ絞り込みだけを追加で適用し、再描画する。
// データの再取得は行わず、sharedDateRange.rawFeatures から日時フィルタ→M/深さフィルタの順で組み立て直す。
function reapplyMagDepthFilter() {
  if (!sharedDateRange.rawFeatures) return;
  const startStr = sharedDateRange.startDate;
  const endStr = sharedDateRange.endDate;
  if (!startStr || !endStr) return;
  const byTime = filterFeaturesByDateTimeRange(
    sharedDateRange.rawFeatures, startStr, endStr,
    sharedDateRange.startTime || '00:00', sharedDateRange.endTime || '23:59'
  );
  const finalFeatures = filterFeaturesByMagDepth(byTime);
  applySharedFeatures(finalFeatures);
  const statusEl = document.getElementById('shared-date-status');
  if (statusEl) statusEl.textContent = `${finalFeatures.length}件（M・深さで絞り込み中）`;
}
let epicenterState = { data: [], startDate: null, endDate: null };

// circle-color（深さ基準グラデーション）とcircle-radius（マグニチュード基準）は
// quake-circlesレイヤーのdata-driven paint式に移行済み。JS側の事前計算関数は撤廃。

function featuresToGeoJSON(feats) {
  // 描画順（circle-sort-key）とスタイリング（circle-color/circle-radius）は
  // MapLibreのdata-driven式・sort-keyに委譲するため、ここではJS側での
  // sortや色・半径の事前計算は行わない（件数が多いと重くなるため）。
  return {
    type: 'FeatureCollection',
    features: feats.map(f => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [f.lon, f.lat] },
      properties: {
        mag: f.mag,
        // depthはcircle-colorのグラデーションに使うため、MapLibreのnull非対応を
        // 踏まえ「深さ不明」は-1のセンチネル値にする（timeと同じ理由）。
        depth: f.depth != null ? f.depth : -1,
        place: f.place,
        // MapLibre（GeoJSONソース→geojson-vt経由）は GeoJSON の null プロパティ値を
        // サポートしておらず、null を渡すとプロパティキー自体が消えることがある。
        // 「時刻不明」を表すセンチネル値として -1 を使い、必ず数値プロパティとして渡す。
        time: f.time != null ? f.time : -1,
        // 診断用：パース前の生の時刻文字列。time が -1（パース失敗）の場合に
        // ポップアップ側で表示し、iOS実機のみで原因を特定できるようにする。
        // GeoJSONプロパティは文字列も許容されるためnullを避け空文字にフォールバック。
        timeRawDebug: f.timeRaw != null ? String(f.timeRaw) : '',
        maxInt: f.maxInt
      }
    }))
  };
}

function applySharedFeatures(rawFeatures) {
  const src = sharedMap.getSource('quake-src');
  if (src) src.setData(featuresToGeoJSON(rawFeatures));

  epicenterState.data = rawFeatures;
  bvalueState.data = rawFeatures.filter(f => f.mag != null);

  if (document.getElementById('bv-result')) {
    computeAndRenderBvalue();
  }
}
const boundary_color = '#000030';

async function loadBaseGeoJsonLayers(worldDataPromise, prefDataPromise) {
  try {
    const [worldData, prefData] = await Promise.all([
      worldDataPromise,
      prefDataPromise
    ]);

    sharedMap.addSource('base-world', { type: 'geojson', data: worldData });
    sharedMap.addLayer({
      id: 'base-world-fill',
      type: 'fill',
      source: 'base-world',
      paint: { 'fill-color': '#8d8d8d', 'fill-opacity': 1 }
    });
    sharedMap.addLayer({
      id: 'base-world-line',
      type: 'line',
      source: 'base-world',
      paint: { 'line-color': boundary_color, 'line-width': 0.6 }
    });

    sharedMap.addSource('base-pref', { type: 'geojson', data: prefData });
    sharedMap.addLayer({
      id: 'base-pref-fill',
      type: 'fill',
      source: 'base-pref',
      paint: { 'fill-color': '#8d8d8d', 'fill-opacity': 1 }
    });
    sharedMap.addLayer({
      id: 'base-pref-line',
      type: 'line',
      source: 'base-pref',
      paint: { 'line-color': boundary_color, 'line-width': 0.6 }
    });

    const baseLayerIds = [
      'base-world-fill', 'base-world-line',
      'base-pref-fill', 'base-pref-line'
    ];
    const beforeId = sharedMap.getLayer('quake-circles') ? 'quake-circles' : undefined;
    baseLayerIds.forEach(id => sharedMap.moveLayer(id, beforeId));
  } catch (e) {
    console.error('ベース地図（GeoJSON）の読み込みに失敗しました:', e);
    toast('ベース地図データの読み込みに失敗しました');
  }
}

async function loadPlateBoundaryLayer(plateDataPromise) {
  try {
    const data = await plateDataPromise;
    sharedMap.addSource('plate-boundaries-src', { type: 'geojson', data });
    sharedMap.addLayer({
      id: 'plate-boundaries-line',
      type: 'line',
      source: 'plate-boundaries-src',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: {
        'line-color': '#cfe0ff',
        'line-width': 1.3,
        'line-opacity': 0.85
      }
    });
    const beforeId = sharedMap.getLayer('quake-circles') ? 'quake-circles' : undefined;
    sharedMap.moveLayer('plate-boundaries-line', beforeId);
  } catch (e) {
    console.error('プレート境界データの読み込みに失敗しました:', e);
    toast('プレート境界データの読み込みに失敗しました');
  }
}

// 震央ポップアップの時刻表示を組み立てる。
// ・featuresToGeoJSON側で「時刻不明」は -1 というセンチネル値に変換して渡している
//   （GeoJSONのnullプロパティはMapLibreが未サポートで、キーごと消えることがあるため）。
// ・iOS Safariでは Intl/toLocaleString が端末設定次第で例外を投げたり空文字を返す
//   ことがあるため、try-catchで確実にフォールバックする。
// ・それでも失敗した場合は「時刻取得エラー」とだけ表示するのではなく、
//   パース前の生の時刻文字列（timeRawDebug）を併記する。これにより、
//   Macの開発者ツールが使えない環境でも、実機の画面を見るだけで
//   「JMAのAPIが実際にどんな時刻文字列を返しているか」を特定できるようにしている。
function formatPopupTime(rawTimeProp, rawTimeDebugStr) {
  const t = Number(rawTimeProp);

  // 「時刻不明」はセンチネル値 -1 のみで表す。1970年より前（epoch msが負）の
  // 正当な地震時刻も存在する（JMAの震源データは1919年分まで遡るため）ので、
  // "t < 0" のような広い条件で弾くと、それらまで「時刻不明」誤判定してしまう。
  if (rawTimeProp == null || isNaN(t) || t === -1) {
    // -1（センチネル値）、未定義、非数値のいずれか＝時刻を特定できなかったケース
    return `<span style="color:var(--text-2);">時刻不明</span>` + debugTimeHint(rawTimeDebugStr);
  }

  try {
    const formatted = new Date(t).toLocaleString('ja-JP');
    if (!formatted || formatted === 'Invalid Date') {
      return `<span style="color:var(--text-2);">時刻の表示に失敗</span>` + debugTimeHint(rawTimeDebugStr);
    }
    return formatted;
  } catch (e) {
    console.error('時刻フォーマットに失敗しました:', e);
    return `<span style="color:var(--text-2);">時刻の表示に失敗</span>` + debugTimeHint(rawTimeDebugStr);
  }
}

// 診断用：時刻がうまく表示できなかった場合にのみ、JMA側から実際に来た
// パース前の生文字列を小さく併記する。普段の利用では気にならないよう控えめな見た目。
function debugTimeHint(rawTimeDebugStr) {
  const shown = rawTimeDebugStr ? JSON.stringify(rawTimeDebugStr) : '(空/未取得)';
  return `<div style="font-size:9.5px; color:var(--text-2); opacity:0.7; margin-top:2px;">生データ: ${shown}</div>`;
}

function initSharedMap() {
  sharedMap = new maplibregl.Map({
    container: 'map-shared',
    style: DARK_STYLE,
    center: JAPAN_CENTER,
    zoom: 4.4,
    attributionControl: { compact: true }
  });
  sharedMap.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

  sharedMap.on('load', () => {
    const worldDataPromise = fetch(GEOJSON_WORLD_URL).then(r => r.json());
    const prefDataPromise = fetch(GEOJSON_PREF_URL).then(r => r.json());
    const plateDataPromise = fetch(GEOJSON_PLATE_BOUNDARIES_URL).then(r => r.json());

    loadBaseGeoJsonLayers(worldDataPromise, prefDataPromise)
      .then(() => loadPlateBoundaryLayer(plateDataPromise));

    sharedMap.addSource('quake-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

    sharedMap.addLayer({
      id: 'quake-circles',
      type: 'circle',
      source: 'quake-src',
      layout: {
        // 描画順：浅い地震ほど手前（上）に来るよう、深さの符号反転をソートキーにする。
        // 深さ不明（-1センチネル）は深さ0kmと同じ扱い（最前面グループ）にする。
        'circle-sort-key': [
          'case',
          ['<', ['get', 'depth'], 0], 0,
          ['*', -1, ['get', 'depth']]
        ]
      },
      paint: {

function defaultDateStr(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

// 開始日時〜終了日時（連続区間）でfeaturesを絞り込む。
// time が -1（パース失敗＝時刻不明）のfeatureは、時刻フィルタ対象外として常に含める
// （除外すると原因不明のデータ欠落に見えてしまうため）。
function filterFeaturesByDateTimeRange(features, startStr, endStr, startTimeStr, endTimeStr) {
  const st = startTimeStr || '00:00';
  const et = endTimeStr || '23:59';
  const rangeStart = new Date(`${startStr}T${st}:00`).getTime();
  // 終了時刻は「その分の終わりまで」を含めるため+59.999秒
  const rangeEnd = new Date(`${endStr}T${et}:00`).getTime() + 59999;
  if (isNaN(rangeStart) || isNaN(rangeEnd)) return features;
  return features.filter(f => {
    if (f.time == null || f.time < 0) return true;
    return f.time >= rangeStart && f.time <= rangeEnd;
  });
}

async function runSharedFetchInner() {
  const startDT = getDateTimeFieldValue('shared-datetime-start');
  const endDT = getDateTimeFieldValue('shared-datetime-end');
  const startStr = startDT.date;
  const endStr = endDT.date;
  const startTimeStr = startDT.time || '00:00';
  const endTimeStr = endDT.time || '23:59';
  const statusEl = document.getElementById('shared-date-status');
  const btn = document.getElementById('shared-date-fetch');
  if (!startStr || !endStr) { toast('開始日時・終了日時を指定してください'); return; }

  const dates = dateRange(startStr, endStr);
  if (dates.length === 0) { toast('日付範囲が不正です'); return; }
  // 92日上限はJMAへのライブfetch負荷を抑えるためのものなので、
  // 全期間がアーカイブ or daily_map（＝当日フィード以外の静的・準静的データ）で
  // カバーされる場合は適用しない。
  const allArchiveCovered = dates.every(d => isArchiveCoveredDate(d) || isDailyMapCoveredDate(d));
  if (!allArchiveCovered && dates.length > 92) { toast('一度に取得できるのは最大92日分です'); return; }

  if (sharedDateRange.rawFeatures && sharedDateRange.startDate === startStr && sharedDateRange.endDate === endStr) {
    const filtered = filterFeaturesByMagDepth(filterFeaturesByDateTimeRange(sharedDateRange.rawFeatures, startStr, endStr, startTimeStr, endTimeStr));
    sharedDateRange.startTime = startTimeStr;
    sharedDateRange.endTime = endTimeStr;
    applySharedFeatures(filtered);
    statusEl.textContent = `${filtered.length}件（共有データから即時反映）`;
    return;
  }

  if (isRangeFullyCached(dates)) {
    const { features, errors } = buildFromCache(dates);
    sharedDateRange.startDate = startStr;
    sharedDateRange.endDate = endStr;
    sharedDateRange.startTime = startTimeStr;
    sharedDateRange.endTime = endTimeStr;
    sharedDateRange.rawFeatures = features;
    const filtered = filterFeaturesByMagDepth(filterFeaturesByDateTimeRange(features, startStr, endStr, startTimeStr, endTimeStr));
    applySharedFeatures(filtered);
    statusEl.textContent = `${filtered.length}件（キャッシュから即時反映）${errors.length ? `／${errors.length}日分は取得失敗` : ''}`;
    return;
  }

  btn.disabled = true;
  statusEl.innerHTML = `<span class="spinner"></span> 取得中 0 / ${dates.length}`;
  updatePeriodChipLabel('取得中…');

  const { features, errors, cacheHits } = await fetchHypoRange(dates, (done, total, errs, hits) => {
    statusEl.innerHTML = `<span class="spinner"></span> 取得中 ${done} / ${total}${hits ? `（キャッシュ ${hits}件）` : ''}`;
  });

  btn.disabled = false;
  sharedDateRange.startDate = startStr;
  sharedDateRange.endDate = endStr;
  sharedDateRange.startTime = startTimeStr;
  sharedDateRange.endTime = endTimeStr;
  sharedDateRange.rawFeatures = features;
  const filtered = filterFeaturesByMagDepth(filterFeaturesByDateTimeRange(features, startStr, endStr, startTimeStr, endTimeStr));
  applySharedFeatures(filtered);

  if (errors.length > 0) {
    statusEl.textContent = `${filtered.length}件取得（${errors.length}日分は取得失敗）`;
    console.warn('hypo fetch errors:', errors);
    if (errors.length === dates.length) {
      toast('CORSまたはネットワークエラーによりデータを取得できませんでした。ブラウザのコンソールを確認してください。');
    }
  } else {
    statusEl.textContent = `${filtered.length}件取得完了${cacheHits ? `（うちキャッシュ ${cacheHits}日分）` : ''}`;
  }
}

let bvalueState = {
  data: [],
  bbox: null,
  polygon: null, // フリーハンド選択の座標配列 [[lon,lat], ...]（閉じた輪）
  drawing: false,
  drawStart: null
};

function setupBboxDrawing() {
  let freehandPoints = null; // ドラッグ中に蓄積する [lng,lat] の配列
  let isDraggingFreehand = false;
  let pendingRafId = null;

  // base-world/base-pref はGeoJSON取得後（非同期）に quake-circles の直前へ
  // moveLayer されるため、その完了タイミング次第で bv-bbox 系レイヤーより
  // 手前（上）に来てしまい、不透明なベース地図がbboxの矩形を覆い隠すことがある。
  // 描画のたびに最前面へ出し直すことで、読み込み順に依存せず常に見えるようにする。
  function bringSelectionLayersToFront() {
    if (sharedMap.getLayer('bv-bbox-fill')) {
      sharedMap.moveLayer('bv-bbox-fill');
      sharedMap.setLayoutProperty('bv-bbox-fill', 'visibility', 'visible');
    }
    if (sharedMap.getLayer('bv-bbox-line')) {
      sharedMap.moveLayer('bv-bbox-line');
      sharedMap.setLayoutProperty('bv-bbox-line', 'visibility', 'visible');
    }
  }

  function polygonGeoJSON(ring) {
    return {
      type: 'FeatureCollection',
      features: [{
        type: 'Feature',
        geometry: { type: 'Polygon', coordinates: [ring] },
        properties: {}
      }]
    };
  }

  function finishDrawing() {
    freehandPoints = null;
    isDraggingFreehand = false;
    if (pendingRafId != null) { cancelAnimationFrame(pendingRafId); pendingRafId = null; }
    bvalueState.drawing = false;
    const btn = document.getElementById('bv-draw-btn');
    if (btn) { btn.classList.remove('btn-accent'); btn.textContent = '領域選択'; }
    sharedMap.getCanvas().style.cursor = '';
    sharedMap.dragPan.enable();
  }

  function onMouseDown(e) {
    if (!bvalueState.drawing) return;
    isDraggingFreehand = true;
    freehandPoints = [[e.lngLat.lng, e.lngLat.lat]];
    sharedMap.dragPan.disable();
    e.preventDefault();
  }

  // mousemoveは高頻度で発火するため、setData（GeoJSON再構築を伴う重い処理）は
  // requestAnimationFrameで間引いて1フレームにつき最大1回に抑える。
  function scheduleDrawUpdate() {
    if (pendingRafId != null) return;
    pendingRafId = requestAnimationFrame(() => {
      pendingRafId = null;
      if (!freehandPoints) return;
      const ring = freehandPoints.length > 2
        ? [...freehandPoints, freehandPoints[0]]
        : freehandPoints;
      sharedMap.getSource('bv-bbox').setData(polygonGeoJSON(ring));
      bringSelectionLayersToFront();
    });
  }

  function onMouseMove(e) {
    if (!isDraggingFreehand || !freehandPoints) return;
    const last = freehandPoints[freehandPoints.length - 1];
    const next = [e.lngLat.lng, e.lngLat.lat];
    // 直前の点とほぼ同じ位置なら間引く（点数を減らして描画・判定を軽くする）
    if (Math.abs(next[0] - last[0]) < 1e-4 && Math.abs(next[1] - last[1]) < 1e-4) return;
    freehandPoints.push(next);
    scheduleDrawUpdate();
  }

  function onMouseUp() {
    if (!isDraggingFreehand || !freehandPoints) return;
    isDraggingFreehand = false;
    if (pendingRafId != null) { cancelAnimationFrame(pendingRafId); pendingRafId = null; }
    if (freehandPoints.length >= 3) {
      const ring = simplifyRing([...freehandPoints, freehandPoints[0]]);
      sharedMap.getSource('bv-bbox').setData(polygonGeoJSON(ring));
      bringSelectionLayersToFront();
      bvalueState.polygon = ring;
      bvalueState.bbox = ringToBbox(ring);
    } else {
      // 3点未満（単なるクリック等）は選択とみなさない
      sharedMap.getSource('bv-bbox').setData({ type: 'FeatureCollection', features: [] });
    }
    freehandPoints = null;
    finishDrawing();
    updateBboxLabel();
    computeAndRenderBvalue();
  }

  sharedMap.on('mousedown', onMouseDown);
  sharedMap.on('mousemove', onMouseMove);
  sharedMap.on('mouseup', onMouseUp);
  // タッチ操作（モバイル）にも対応
  sharedMap.on('touchstart', onMouseDown);
  sharedMap.on('touchmove', onMouseMove);
  sharedMap.on('touchend', onMouseUp);

  bvalueState._cancelDrawing = () => { finishDrawing(); };
  bvalueState._onDrawModeChanged = (isDrawing) => {
    if (!isDrawing) { finishDrawing(); return; }
    sharedMap.getCanvas().style.cursor = 'crosshair';
  };
}

function ringToBbox(ring) {
  let minLon = Infinity, minLat = Infinity, maxLon = -Infinity, maxLat = -Infinity;
  for (const [lon, lat] of ring) {
    if (lon < minLon) minLon = lon;
    if (lon > maxLon) maxLon = lon;
    if (lat < minLat) minLat = lat;
    if (lat > maxLat) maxLat = lat;
  }
  return [minLon, minLat, maxLon, maxLat];
}

// フリーハンド描画で蓄積された頂点列を間引く。
// 一定間隔ごとに1点を残す簡易サンプリングで、判定・描画の負荷を抑える。
// （厳密なDouglas-Peuckerではないが、フリーハンド領域選択の用途では十分）
function simplifyRing(ring, maxPoints = 300) {
  if (ring.length <= maxPoints) return ring;
  const step = ring.length / maxPoints;
  const simplified = [];
  for (let i = 0; i < maxPoints; i++) {
    simplified.push(ring[Math.floor(i * step)]);
  }
  // 閉じた輪を保証（始点と終点を一致させる）
  simplified.push(ring[0]);
  return simplified;
}

function updateBboxLabel() {
  const el = document.getElementById('bv-bbox-label');
  if (!el) return;
  if (!bvalueState.bbox) { el.textContent = '未選択'; return; }
  const [minLon, minLat, maxLon, maxLat] = bvalueState.bbox;
  const rangeText = `${minLat.toFixed(2)}〜${maxLat.toFixed(2)}°N, ${minLon.toFixed(2)}〜${maxLon.toFixed(2)}°E`;
  el.textContent = bvalueState.polygon ? `フリーハンド範囲（${rangeText}）` : rangeText;
}
